<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>弘峻莊園-專屬拆款系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
    :root { --brand-gold:#b5945d; --brand-dark:#1a302b; --brand-light:#f9f7f2; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; font-family:'Noto Serif TC',serif; background:#fff; }
    .phone-container { height:100dvh; display:flex; flex-direction:column; }
    .header-container { flex-shrink:0; width:100%; height:14dvh; position:relative; overflow:hidden; border-bottom:3px solid var(--brand-gold); background:radial-gradient(circle at 50% 20%, rgba(181,148,93,.35), transparent 36%), linear-gradient(135deg,#0f211e,#1a302b 55%,#0d1b18); }
    .header-img { display:none; }
    .header-overlay { position:absolute; inset:0; background:rgba(26,48,43,.1); display:flex; justify-content:center; align-items:center; }
    .brand-title { margin:0; font-size:20px; letter-spacing:8px; color:var(--brand-gold); font-weight:700; text-shadow:2px 2px 4px rgba(0,0,0,.6); padding-left:8px; }
    .input-section { padding:10px 12px; background:var(--brand-light); flex-shrink:0; border-bottom:1px solid #ddd; }
    .grid-container { display:flex; flex-direction:column; gap:10px; }
    .input-row { display:flex; gap:10px; }
    .input-group { flex:1; display:flex; flex-direction:column; }
    .input-group label { font-size:9px; color:#888; margin-bottom:2px; font-weight:bold; white-space:nowrap; }
    .input-wrapper { display:flex; align-items:center; border-bottom:1.5px solid var(--brand-gold); background:rgba(255,255,255,.5); padding:2px 4px; }
    .input-wrapper input { flex:1; width:100%; padding:4px 0; border:none; background:transparent; font-family:'Noto Serif TC',serif; outline:none; font-size:14px; color:var(--brand-dark); min-width:0; }
    .unit-label { font-size:10px; color:var(--brand-gold); margin-left:2px; font-weight:bold; }
    .total-wrapper { text-align:center; margin-top:5px; padding-top:5px; border-top:1px dashed #ccc; }
    .total-wrapper label { font-size:9px; color:#888; display:block; }
    .total-wrapper input { width:140px; font-size:20px; font-weight:bold; text-align:center; border:none; border-bottom:2px solid var(--brand-gold); background:rgba(181,148,93,.08); outline:none; color:var(--brand-dark); }
    .table-section { flex-grow:1; padding:5px 12px; overflow-y:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    td { padding:8px 4px; border-bottom:1px solid #eee; }
    .info-row { display:none; background:#fcfcfc; }
    .info-row td { padding:10px 5px; border-bottom:1.5px solid var(--brand-gold); color:var(--brand-dark); font-size:11px; font-weight:bold; }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px 10px; }
    .col-name { font-weight:700; color:var(--brand-dark); }
    .col-ratio { color:#999; text-align:center; width:42px; font-size:10px; }
    .col-val { text-align:right; font-weight:700; width:85px; color:#000; }
    .total-row { background:var(--brand-dark)!important; color:#fff!important; }
    .total-row td { padding:12px 5px; border-top:2px solid var(--brand-gold); font-weight:700; font-size:14px; }
    .btn-section { padding:8px 20px 12px; flex-shrink:0; }
    .print-btn { width:100%; background:var(--brand-gold); color:#fff; border:none; padding:12px; font-size:13px; letter-spacing:2px; border-radius:4px; font-family:'Noto Serif TC',serif; font-weight:bold; cursor:pointer; }
    @page { size:A4 portrait; margin:8mm; }
    @media print {
      body, html { overflow:visible!important; height:auto!important; width:100%!important; background:#fff!important; }
      .phone-container { height:auto!important; display:block!important; width:100%!important; }
      .btn-section, .input-section { display:none!important; }
      .header-container { height:118px!important; border-bottom-width:2px!important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .brand-title { font-size:18px!important; letter-spacing:6px!important; }
      .table-section { padding:4px 8px 0!important; overflow:visible!important; }
      table { font-size:11.5px!important; line-height:1.2!important; page-break-inside:avoid!important; }
      td { padding:5px 4px!important; }
      .info-row { display:table-row!important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .info-row td { padding:7px 5px!important; font-size:10px!important; }
      .info-grid { gap:3px 8px!important; }
      .col-ratio { width:38px!important; font-size:9px!important; }
      .col-val { width:78px!important; }
      .total-row { background:#1a302b!important; color:#fff!important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      .total-row td { color:#fff!important; padding:8px 5px!important; font-size:13px!important; }
    }
  </style>
</head>
<body>
<div class="phone-container">
  <div class="header-container">
    <div class="header-overlay"><h1 class="brand-title">弘峻莊園</h1></div>
  </div>
  <div class="input-section">
    <div class="grid-container">
      <div class="input-row">
        <div class="input-group"><label>戶別 UNIT</label><div class="input-wrapper"><input type="text" id="unitInput" placeholder="輸入戶別" oninput="calculate()"></div></div>
        <div class="input-group"><label>戶別坪數 SIZE</label><div class="input-wrapper"><input type="number" id="sizeInput" placeholder="0.00" oninput="calculate()" step="0.01"><span class="unit-label">坪</span></div></div>
      </div>
      <div class="input-row">
        <div class="input-group"><label>房屋總價 HOUSE PRICE</label><div class="input-wrapper"><input type="number" id="housePriceInput" value="733" placeholder="0" oninput="calculate()" pattern="[0-9]*" inputmode="numeric"><span class="unit-label">萬</span></div></div>
        <div class="input-group"><label>車位價格 PARKING PRICE</label><div class="input-wrapper"><input type="number" id="parkPriceInput" placeholder="0" oninput="calculate()" pattern="[0-9]*" inputmode="numeric"><span class="unit-label">萬</span></div></div>
      </div>
      <div class="input-row">
        <div class="input-group"><label>車位 PARKING</label><div class="input-wrapper"><input type="text" id="parkInput" placeholder="輸入車位" oninput="calculate()"></div></div>
      </div>
    </div>
    <div class="total-wrapper"><label>物業總額（房屋總價＋車位價格／萬元）</label><input type="number" id="totalPrice" value="733" readonly tabindex="-1" pattern="[0-9]*" inputmode="numeric"></div>
  </div>
  <div class="table-section">
    <table><tbody id="rowList"></tbody><tfoot><tr class="total-row"><td>合計總額 (TOTAL)</td><td class="col-ratio">100%</td><td class="col-val" id="totalDisplay" style="color:white;">0 萬</td></tr></tfoot></table>
  </div>
  <div class="btn-section"><button class="print-btn" onclick="window.print()">產生正式報表 | PRINT</button></div>
</div>
<script>
function calculate(){
  const u=document.getElementById('unitInput').value||'—';
  const s=document.getElementById('sizeInput').value||'—';
  const p=document.getElementById('parkInput').value||'—';
  const housePriceRaw=document.getElementById('housePriceInput').value;
  const parkPriceRaw=document.getElementById('parkPriceInput').value;
  const housePrice=parseFloat(housePriceRaw)||0;
  const parkPrice=parseFloat(parkPriceRaw)||0;
  const pp=parkPriceRaw!==''?parkPrice.toLocaleString():'—';
  const val=housePrice+parkPrice;
  document.getElementById('totalPrice').value=val;
  const dep=5;
  const sign=Math.ceil(val*.06)-dep;
  const e1=Math.round(val*.02), e2=Math.round(val*.02), e3=Math.round(val*.02);
  const bank=Math.floor(val*.80);
  const handOver=Math.ceil(val*.05);
  const seal=val-(dep+sign+e1+e2+e3+bank+handOver);
  const items=[
    {n:'訂金',r:'固定',v:dep},
    {n:'簽約金',r:'6%',v:sign},
    {n:'工程款第一期 - 第一區屋頂版完成',r:'2%',v:e1},
    {n:'工程款第二期 - 第二區屋頂版完成',r:'2%',v:e2},
    {n:'工程款第三期 - 第三區屋頂版完成',r:'2%',v:e3},
    {n:'備證用印款',r:'3%',v:seal},
    {n:'銀行貸款',r:'80%',v:bank},
    {n:'交屋保留款',r:'5%',v:handOver}
  ];
  let h=`<tr class="info-row"><td colspan="3"><div class="info-grid"><div><span style="color:#888">戶別：</span>${u}</div><div><span style="color:#888">坪數：</span>${s} 坪</div><div><span style="color:#888">房屋總價：</span>${housePrice.toLocaleString()} 萬</div><div><span style="color:#888">車位價：</span>${pp} 萬</div><div><span style="color:#888">車位：</span>${p}</div><div><span style="color:#888">物業總額：</span>${val.toLocaleString()} 萬</div></div></td></tr>`;
  items.forEach(i=>{h+=`<tr><td class="col-name">${i.n}</td><td class="col-ratio">${i.r}</td><td class="col-val">${i.v.toLocaleString()} 萬</td></tr>`});
  document.getElementById('rowList').innerHTML=h;
  document.getElementById('totalDisplay').innerText=val.toLocaleString()+' 萬';
}
calculate();
</script>
</body>
</html>
