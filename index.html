<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>弘峻莊園-專屬拆款系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
    :root{--lime:#dce400;--green:#0f6030;--dark:#163321;--gold:#b7812a;--line:#dfe7b9;--ink:#211d1b;--paper:#fffdf2;--card:#fffefa}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}button,input{font:inherit}html,body{margin:0;width:100%;height:100%;font-family:'Noto Serif TC',serif;color:var(--ink);overflow:hidden;background:linear-gradient(180deg,#f4f7d8,#eef4c2)}
    .app{width:min(100%,920px);height:100dvh;margin:0 auto;background:rgba(255,255,255,.88);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 14px 42px rgba(37,65,22,.14)}.content{flex:1;overflow:auto;background:rgba(255,255,255,.94)}
    .hero{height:96px;padding:14px 16px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#e2e800 0%,#dce400 60%,#cfdb00 100%);border-bottom:4px solid rgba(183,129,42,.55);overflow:hidden}.eyebrow{font-size:10px;letter-spacing:3px;color:#90651f;font-weight:900;margin-bottom:6px}.title{margin:0;font-size:27px;letter-spacing:3px;line-height:1;font-weight:900}.subtitle{font-size:11px;letter-spacing:1px;color:#45523c;font-weight:900;margin-top:7px}
    .input-section{padding:10px;background:#fbfdf0;border-bottom:1px solid var(--line)}.form-groups{display:grid;gap:10px}.form-block{border:1px solid rgba(223,231,185,.9);border-radius:16px;padding:10px;background:rgba(255,255,255,.82)}.block-title{margin:0 0 10px;color:var(--dark);font-weight:900;letter-spacing:1px;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:flex;justify-content:space-between;margin:0 0 5px;font-size:11px;color:var(--dark);font-weight:900}.field label span{font-size:9px;letter-spacing:2px;color:var(--gold)}.control{display:flex;align-items:center;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}.control input{width:100%;border:0;outline:0;background:transparent;padding:8px;font-size:15px;font-weight:900;color:var(--ink);min-width:0}.unit{padding:0 10px;color:#8f641f;font-size:14px;font-weight:900}.floor-toggle{display:flex;width:100%;padding:4px;gap:6px}.floor-btn{flex:1;border:1px solid #d9e1b8;border-radius:11px;background:#fffef7;color:#49624d;font-size:14px;font-weight:900;padding:7px 0}.floor-btn.active{background:linear-gradient(135deg,#41b857,#176a38);color:#fff;border-color:#176a38}
    .total-card{margin-top:12px;border:1px solid #dce5b6;background:linear-gradient(135deg,#fffef6,#eef8d8);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.total-label{font-size:15px;font-weight:900;color:#405448}.total-sub{font-size:11px;color:#7a845f;font-weight:700;margin-top:2px}.total-value{font-size:29px;line-height:1;font-weight:900;color:#17211a;text-align:right}.total-value small{font-size:15px;color:var(--gold);margin-left:5px}.status{display:none;margin-top:10px;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:900}.status.show{display:block}.status.ok{background:#eef8df;color:#235533;border:1px solid #cfe3b1}.status.warn{background:#fff5dd;color:#73521a;border:1px solid #ead399}.status.error{background:#fff0ef;color:#9b2b2b;border:1px solid #e6b9b5}
    .table-section{padding:10px}.screen-title{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;flex-direction:column}.screen-title h2{margin:0;font-size:18px;letter-spacing:1px;color:var(--dark)}.screen-title .time{font-size:10px;color:#75806d;font-weight:700}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fffefb;border:1px solid #edf0de;border-radius:15px;overflow:hidden}th,td{border-right:1px solid #edf0de;border-bottom:1px solid #edf0de;padding:8px 9px;text-align:left}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}th{background:#f1f7dc;color:#415148;font-weight:900}.ratio{text-align:right;font-weight:900;color:#385140;white-space:nowrap}.amount{text-align:right;font-weight:900;font-size:17px;color:#1b251d;white-space:nowrap}.screen-total td{background:linear-gradient(135deg,#236238,#0f4c2b)!important;color:#fff!important;border-top:4px solid var(--gold);font-size:17px;font-weight:900}.screen-total .amount{font-size:24px}.desktop-table{display:none}.payment-cards{display:grid;gap:8px}.payment-card{border:1px solid #edf0de;background:#fffefb;border-radius:14px;padding:10px 12px}.pay-name{font-weight:900;color:#22372b;font-size:13px}.pay-meta{margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center}.pay-ratio{font-size:12px;color:#55705a;font-weight:900}.pay-amount{font-size:18px;font-weight:900;color:#17211a;white-space:nowrap}.payment-card.total{background:linear-gradient(135deg,#236238,#0f4c2b);border-top:4px solid var(--gold);color:#fff}.payment-card.total *{color:#fff}.payment-card.total .pay-amount{font-size:24px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 10px 12px;background:rgba(255,255,255,.94);border-top:1px solid var(--line)}.action-btn{border:0;border-radius:15px;padding:12px 8px;font-size:12px;letter-spacing:1px;font-weight:900}.primary{grid-column:1/-1;order:-1;background:linear-gradient(135deg,#2faf48,#155d31);color:#fff}.secondary{background:#fffef7;border:1px solid #dfe7b9;color:#405448}.action-btn:disabled{opacity:.45}.print-page{display:none}
    @media(min-width:641px){.hero{height:108px;text-align:left;padding:18px 24px}.title{font-size:34px}.subtitle{font-size:13px}.input-section{padding:14px 16px}.form-block{padding:12px}.grid{gap:10px 12px}.desktop-table{display:table}.payment-cards{display:none}.screen-title{flex-direction:row;align-items:flex-end}.actions{grid-template-columns:1.1fr 1fr 1fr;padding:10px 16px 14px}.primary{grid-column:auto;order:0}.action-btn{font-size:13px;padding:13px 10px}}
    @page{size:A4 portrait;margin:0}
    @media print{html,body{width:210mm;height:297mm;background:#fff!important;overflow:visible!important;margin:0!important;padding:0!important}.app{display:none!important}.print-page{display:block!important;width:210mm;min-height:297mm;background:var(--paper);padding:8mm 10mm;position:relative;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden}.print-brand-hero{height:34mm;position:relative;overflow:hidden;border-bottom:1.25mm solid var(--gold);border-radius:0 0 3.5mm 3.5mm;background:radial-gradient(circle at 4% 116%,rgba(7,74,31,.95) 0 8%,transparent 8.5%),radial-gradient(circle at 10% 104%,rgba(87,228,77,.58) 0 7%,transparent 7.5%),radial-gradient(circle at 92% 105%,rgba(255,255,182,.9) 0 12%,transparent 12.5%),radial-gradient(circle at 98% 112%,rgba(7,74,31,.95) 0 12%,transparent 12.5%),linear-gradient(90deg,#d9e300,#e6ed00 48%,#d7e000);box-shadow:0 1.2mm 5mm rgba(40,65,19,.08)}.print-brand-hero:before{content:'弘峻莊園';position:absolute;left:34mm;top:11mm;font-size:23pt;font-weight:900;letter-spacing:1.8px;color:#201812}.print-brand-hero:after{content:'付款試算單';position:absolute;left:108mm;top:12mm;font-size:18pt;font-weight:900;letter-spacing:3px;color:#2b1b0b}.print-brand-sub{position:absolute;left:50mm;top:23mm;font:900 9pt 'Times New Roman',serif;letter-spacing:4.5px;color:#201812}.print-pay-sub{position:absolute;left:111mm;top:25mm;font:700 6.5pt 'Times New Roman',serif;letter-spacing:3px;color:#9a6a22}.print-divider{position:absolute;left:101mm;top:8mm;height:19mm;border-left:.45mm solid #8f6522}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin:4mm 0}.summary-card{background:#fff;border:.35mm solid #dfe4c8;border-radius:3mm;overflow:hidden}.summary-title{background:#eff3da;color:#3f552f;font-size:8pt;font-weight:900;letter-spacing:1px;padding:2.2mm 3mm;border-bottom:.3mm solid #dfe4c8}.summary-body{padding:.8mm 0}.summary-line{display:flex;justify-content:space-between;align-items:center;padding:1.8mm 3mm;font-size:8.7pt;font-weight:900;color:#18211b}.summary-line span:first-child{color:#5a6653}.summary-line.highlight span:last-child{font-size:10pt}.report-head{display:flex;justify-content:space-between;align-items:flex-end;margin:3.5mm 0 2.2mm}.report-head h1{margin:0;font-size:14pt;color:#173321;letter-spacing:1px;font-weight:900}.report-head h1:after{content:'';display:block;width:22mm;border-bottom:.9mm solid var(--gold);margin-top:1.2mm}.report-time{font-size:7.5pt;color:#657060;font-weight:900}.print-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:.35mm solid #e4e8d4;border-radius:3mm;background:#fffef9;font-size:8.8pt}.print-table th{background:#eef3da;color:#445343;font-weight:900;font-size:8.5pt;padding:2.6mm 3mm}.print-table td{padding:2.6mm 3mm;border-top:.2mm solid #ecefdf;color:#1f2520}.print-table .p-ratio{text-align:right;color:#586358;font-weight:900}.print-table .p-amount{text-align:right;font-size:12pt;font-weight:900}.key-row td{background:#fffdf0}.print-total td{background:linear-gradient(135deg,#165c34,#0f4a2b)!important;color:#fff!important;border-top:1mm solid var(--gold)!important;padding:3.4mm 3mm!important}.print-total .total-word{font-size:13pt;font-weight:900}.print-total .p-amount{font-size:18pt;font-weight:900}.print-footer{position:absolute;left:10mm;right:10mm;bottom:14mm;display:flex;justify-content:space-between;border-top:.25mm solid #e1e5cb;padding-top:3mm;font-size:7pt;color:#566052;font-weight:700}}
  </style>
</head>
<body>
  <div class="app"><header class="hero"><div class="eyebrow">PAYMENT CALCULATOR</div><h1 class="title">弘峻莊園</h1><div class="subtitle">JADE GARDEN｜專屬拆款計算機</div></header><main class="content"><section class="input-section"><div class="form-groups"><div class="form-block"><h3 class="block-title">01 基本資料</h3><div class="grid"><div class="field"><label>戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" type="text" placeholder="例如 A1-5F" oninput="calculate()"></div></div><div class="field"><label>坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" placeholder="0.00" step="0.01" inputmode="decimal" oninput="calculate()"><b class="unit">坪</b></div></div></div></div><div class="form-block"><h3 class="block-title">02 車位資料</h3><div class="grid"><div class="field"><label>車位樓層 <span>FLOOR</span></label><div class="control"><div class="floor-toggle"><button class="floor-btn active" type="button" data-floor="B1" onclick="setFloor('B1')">B1</button><button class="floor-btn" type="button" data-floor="B2" onclick="setFloor('B2')">B2</button></div></div></div><div class="field"><label>車位編號 <span>NUMBER</span></label><div class="control"><input id="parkingNumberInput" type="text" placeholder="例如 321" oninput="calculate()"></div></div></div></div><div class="form-block"><h3 class="block-title">03 價格資料</h3><div class="grid"><div class="field"><label>房屋價格 <span>HOUSE</span></label><div class="control"><input id="housePriceInput" type="number" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div><div class="field"><label>車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div></div><div class="total-card"><div><div class="total-label">總價</div><div class="total-sub">房屋價格＋車位價格</div></div><div class="total-value"><span id="screenTotalValue">0</span><small>萬</small></div></div><div class="status" id="statusBox"></div></div></div></section><section class="table-section"><div class="screen-title"><h2>拆款計算明細</h2><span class="time" id="screenTime"></span></div><table class="desktop-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="screenRows"></tbody><tfoot><tr class="screen-total"><td>總價</td><td class="ratio">100%</td><td class="amount" id="screenTotalAmount">0 萬</td></tr></tfoot></table><div class="payment-cards" id="paymentCards"></div></section></main><div class="actions"><button id="printBtn" class="action-btn primary" type="button">產生正式報表</button><button id="copyBtn" class="action-btn secondary" type="button">複製摘要</button><button id="clearBtn" class="action-btn secondary" type="button">清空資料</button></div></div>
  <section class="print-page"><div class="print-brand-hero"><div class="print-brand-sub">JADE GARDEN</div><div class="print-divider"></div><div class="print-pay-sub">Payment Estimate</div></div><div class="summary-grid"><div class="summary-card"><div class="summary-title">房屋資料</div><div class="summary-body"><div class="summary-line"><span>戶別</span><span id="printUnit">—</span></div><div class="summary-line"><span>坪數</span><span><span id="printSize">—</span> 坪</span></div><div class="summary-line highlight"><span>房屋價格</span><span><span id="printHousePrice">—</span> 萬</span></div></div></div><div class="summary-card"><div class="summary-title">車位資料</div><div class="summary-body"><div class="summary-line"><span>車位</span><span id="printParking">—</span></div><div class="summary-line highlight"><span>車位價格</span><span><span id="printParkingPrice">—</span> 萬</span></div></div></div></div><div class="report-head"><h1>拆款計算明細</h1><div class="report-time" id="printTime"></div></div><table class="print-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="printRows"></tbody><tfoot><tr class="print-total"><td><div class="total-word">總價</div></td><td class="p-ratio">100%</td><td class="p-amount" id="printTotalAmount">0 萬</td></tr></tfoot></table><div class="print-footer"><div>所有金額單位：萬元</div><div>本報表由弘峻莊園拆款計算機產生</div></div></section>
<script>
let parkingFloor='B1',latestRows=[],latestTotal=0,latestValid=false;function $(id){return document.getElementById(id)}function setFloor(f){parkingFloor=f;document.querySelectorAll('.floor-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.floor===f));calculate()}function money(n){return Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0})}function nowText(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}function safe(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function showStatus(type,text){const box=$('statusBox');box.className='status show '+type;box.textContent=text}
function calculate(){const unit=$('unitInput').value.trim()||'—',sizeRaw=$('sizeInput').value,size=sizeRaw||'—',housePriceRaw=$('housePriceInput').value,housePrice=parseFloat(housePriceRaw)||0;const parkingNo=$('parkingNumberInput').value.trim(),parkingText=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`,parkingPriceRaw=$('parkPriceInput').value,parkingPrice=parseFloat(parkingPriceRaw)||0;const total=Math.round(housePrice+parkingPrice),deposit=2,sign=8,startWork=Math.max(0,Math.ceil(total*.05)-deposit-sign),foundation=Math.round(total*.02),firstFloor=Math.round(total*.02),rf1=Math.round(total*.02),rf2=Math.round(total*.02),loan=Math.floor(total*.80),handover=Math.ceil(total*.05),rf3=total-(deposit+sign+startWork+foundation+firstFloor+rf1+rf2+loan+handover);const rows=[{name:'訂金',ratio:'',amount:deposit},{name:'簽約金',ratio:'',amount:sign},{name:'開工款',ratio:'5% - 10萬',amount:startWork,key:true},{name:'第一期工程款－基礎開挖完成',ratio:'2%',amount:foundation},{name:'第二期工程款－一樓底版完成',ratio:'2%',amount:firstFloor},{name:'第三期工程款－第一區RF完成',ratio:'2%',amount:rf1},{name:'第四期工程款－第二區RF完成',ratio:'2%',amount:rf2},{name:'第五期工程款－第三區RF完成',ratio:'2%',amount:rf3},{name:'銀行貸款',ratio:'80%',amount:loan,key:true},{name:'交屋保留款',ratio:'5%',amount:handover,key:true}];const sum=rows.reduce((a,r)=>a+r.amount,0);latestRows=rows;latestTotal=total;latestValid=housePrice>0&&sum===total;$('screenRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="ratio">${safe(r.ratio)}</td><td class="amount">${money(r.amount)} 萬</td></tr>`).join('');$('printRows').innerHTML=rows.map(r=>`<tr class="${r.key?'key-row':''}"><td>${safe(r.name)}</td><td class="p-ratio">${safe(r.ratio)}</td><td class="p-amount">${money(r.amount)} 萬</td></tr>`).join('');$('paymentCards').innerHTML=rows.map(r=>`<div class="payment-card"><div class="pay-name">${safe(r.name)}</div><div class="pay-meta"><span class="pay-ratio">${safe(r.ratio)}</span><span class="pay-amount">${money(r.amount)} 萬</span></div></div>`).join('')+`<div class="payment-card total"><div class="pay-name">總價</div><div class="pay-meta"><span class="pay-ratio">100%</span><span class="pay-amount">${money(total)} 萬</span></div></div>`;$('screenTotalValue').textContent=money(total);$('screenTotalAmount').textContent=money(total)+' 萬';$('printTotalAmount').textContent=money(total)+' 萬';$('printUnit').textContent=unit;$('printSize').textContent=size;$('printHousePrice').textContent=housePriceRaw===''?'—':money(Math.round(housePrice));$('printParking').textContent=parkingText;$('printParkingPrice').textContent=parkingPriceRaw===''?'—':money(Math.round(parkingPrice));const t=nowText();$('screenTime').textContent=t;$('printTime').textContent=t;if(housePrice<=0)showStatus('warn','請輸入房屋價格後再產生正式報表。');else if(sum!==total)showStatus('error',`拆款合計 ${money(sum)} 萬，與總價 ${money(total)} 萬不一致，請檢查。`);else showStatus('ok','拆款合計已核對，等於總價。');$('printBtn').disabled=!latestValid}
function printReport(){calculate();if(!latestValid){showStatus('error','資料尚未完整或合計不一致，暫時無法產生報表。');return}setTimeout(()=>window.print(),80)}function copySummary(){calculate();const unit=$('unitInput').value.trim()||'—',size=$('sizeInput').value||'—',housePrice=parseFloat($('housePriceInput').value)||0,parkingNo=$('parkingNumberInput').value.trim(),parking=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`,parkingPriceRaw=$('parkPriceInput').value;const text=[`弘峻莊園｜付款試算`,`戶別：${unit}`,`坪數：${size} 坪`,`房屋價格：${housePrice?money(Math.round(housePrice)):'—'} 萬`,`車位：${parking}`,`車位價格：${parkingPriceRaw===''?'—':money(Math.round(parseFloat(parkingPriceRaw)||0))} 萬`,`總價：${money(latestTotal)} 萬`,``,...latestRows.map(r=>`${r.name}：${money(r.amount)} 萬${r.ratio?`（${r.ratio}）`:''}`)].join('\n');navigator.clipboard?.writeText(text).then(()=>showStatus('ok','已複製付款摘要，可直接貼到 LINE。')).catch(()=>showStatus('warn','瀏覽器未允許自動複製，請改用手動選取。'))}function clearForm(){['unitInput','sizeInput','parkingNumberInput','housePriceInput','parkPriceInput'].forEach(id=>$(id).value='');setFloor('B1');calculate()}$('printBtn').addEventListener('click',printReport);$('copyBtn').addEventListener('click',copySummary);$('clearBtn').addEventListener('click',clearForm);calculate();
</script>
</body>
</html>
