<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>弘峻莊園-專屬拆款系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
    :root{--lime:#dce400;--lime-2:#e8ee4a;--jade:#2b9b45;--jade-deep:#0f6030;--jade-dark:#163321;--gold:#b7812a;--paper:#fffdf2;--card:#fffefa;--line:#dfe7b9;--ink:#211d1b;--muted:#5e6b5f;--danger:#9b2b2b;--shadow:0 14px 42px rgba(37,65,22,.14)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    img,svg,object{display:none!important}
    body,html{margin:0;padding:0;width:100%;height:100%;font-family:'Noto Serif TC',serif;color:var(--ink);overflow:hidden;background:radial-gradient(circle at 5% 86%,rgba(18,103,38,.30) 0 7%,transparent 8%),radial-gradient(circle at 16% 94%,rgba(70,178,65,.20) 0 9%,transparent 10%),radial-gradient(circle at 92% 88%,rgba(28,116,45,.24) 0 12%,transparent 13%),linear-gradient(180deg,#f4f7d8 0%,#eef4c2 100%)}
    button,input{font:inherit}
    .app{width:min(100%,920px);height:100dvh;margin:0 auto;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .hero{height:108px;flex-shrink:0;padding:18px 24px;position:relative;overflow:hidden;color:var(--ink);border-bottom:4px solid rgba(183,129,42,.55);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at -2% 112%,rgba(6,82,32,.88) 0 12%,transparent 13%),radial-gradient(circle at 102% 112%,rgba(12,92,35,.88) 0 14%,transparent 15%),linear-gradient(135deg,#e2e800 0%,#dce400 58%,#cfdb00 100%)}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:multiply;opacity:.35}.hero:before{left:-50px;bottom:-72px;width:150px;height:150px;background:radial-gradient(circle,rgba(12,86,35,.85),rgba(44,156,55,.62),transparent 66%)}.hero:after{right:-56px;bottom:-80px;width:175px;height:175px;background:radial-gradient(circle,rgba(12,86,35,.86),rgba(58,181,70,.58),transparent 68%)}
    .eyebrow,.title,.subtitle{position:relative;z-index:1}.eyebrow{margin:0 0 7px;font-size:12px;letter-spacing:5px;color:#90651f;font-weight:900;text-transform:uppercase}.title{margin:0;text-align:left;font-size:34px;letter-spacing:5px;line-height:1;color:#231f1c;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.25)}.subtitle{margin:8px 0 0;font-size:13px;letter-spacing:2px;color:#45523c;font-weight:900}
    .content{flex:1;overflow:auto;background:rgba(255,255,255,.9)}.input-section{padding:14px 16px 12px;background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(250,252,235,.94));border-bottom:1px solid var(--line)}.form-groups{display:grid;grid-template-columns:1fr;gap:12px}.form-block{border:1px solid rgba(223,231,185,.9);border-radius:18px;padding:12px;background:rgba(255,255,255,.72);box-shadow:0 8px 20px rgba(64,91,28,.05)}.block-title{margin:0 0 10px;color:var(--jade-dark);font-weight:900;letter-spacing:1px;font-size:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.field{min-width:0}.field label{display:flex;justify-content:space-between;align-items:center;margin:0 0 5px;font-size:12px;color:var(--jade-dark);font-weight:900}.field label span{font-size:10px;letter-spacing:2px;color:var(--gold)}.control{display:flex;align-items:center;min-height:46px;border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 5px 16px rgba(68,92,28,.05);transition:.18s ease}.control:focus-within{border-color:#aec837;box-shadow:0 0 0 3px rgba(205,223,42,.18),0 8px 18px rgba(68,92,28,.08)}.control input{width:100%;border:0;outline:none;background:transparent;padding:10px 12px;font-size:17px;font-weight:900;color:var(--ink);min-width:0}.control input::placeholder{color:#b3bca2}.unit{padding:0 12px;color:#8f641f;font-size:14px;font-weight:900;white-space:nowrap}
    .floor-toggle{display:flex;width:100%;padding:4px;gap:6px}.floor-btn{flex:1;border:1px solid #d9e1b8;border-radius:11px;background:linear-gradient(180deg,#fffef7,#f4f7e2);color:#49624d;font-size:15px;font-weight:900;padding:8px 0;cursor:pointer;transition:.18s ease}.floor-btn.active{background:linear-gradient(135deg,#41b857 0%,#176a38 100%);color:#fff;border-color:#176a38;box-shadow:0 6px 16px rgba(23,106,56,.24)}
    .total-card{margin-top:12px;border:1px solid #dce5b6;background:radial-gradient(circle at 100% 0%,rgba(220,228,0,.22),transparent 34%),linear-gradient(135deg,#fffef6 0%,#f8fbe4 54%,#eef8d8 100%);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(64,91,28,.08);position:relative;overflow:hidden}.total-label{font-size:15px;font-weight:900;color:#405448}.total-sub{font-size:11px;color:#7a845f;font-weight:700;margin-top:2px}.total-value{font-size:35px;line-height:1;font-weight:900;color:#17211a;text-align:right}.total-value small{font-size:15px;color:var(--gold);margin-left:5px}
    .status{display:none;margin-top:10px;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:900}.status.show{display:block}.status.ok{background:#eef8df;color:#235533;border:1px solid #cfe3b1}.status.warn{background:#fff5dd;color:#73521a;border:1px solid #ead399}.status.error{background:#fff0ef;color:var(--danger);border:1px solid #e6b9b5}.table-section{padding:12px 16px 14px}.screen-title{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 0 10px;gap:8px}.screen-title h2{margin:0;font-size:18px;letter-spacing:1px;color:var(--jade-dark)}.screen-title .time{font-size:10px;color:#75806d;font-weight:700;white-space:nowrap}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fffefb;border:1px solid #edf0de;border-radius:15px;overflow:hidden}th,td{border-right:1px solid #edf0de;border-bottom:1px solid #edf0de;padding:8px 9px;text-align:left}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}th{background:linear-gradient(180deg,#f8fbea,#f1f7dc);color:#415148;font-weight:900}td.ratio{text-align:right;font-weight:900;width:130px;color:#385140;line-height:1.35;white-space:nowrap}td.amount{text-align:right;font-weight:900;font-size:17px;width:108px;color:#1b251d;white-space:nowrap}.screen-total td{background:linear-gradient(135deg,#236238,#0f4c2b)!important;color:#fff!important;border-top:4px solid var(--gold);font-size:17px;font-weight:900;border-bottom:0}.screen-total .amount{font-size:24px}
    .payment-cards{display:none;gap:8px}.payment-card{border:1px solid #edf0de;background:#fffefb;border-radius:14px;padding:10px 12px}.payment-card .pay-name{font-weight:900;color:#22372b;font-size:13px;line-height:1.45}.payment-card .pay-meta{margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center}.payment-card .pay-ratio{font-size:12px;color:#55705a;font-weight:900}.payment-card .pay-amount{font-size:18px;font-weight:900;color:#17211a;white-space:nowrap}.payment-card.total{background:linear-gradient(135deg,#236238,#0f4c2b);border-top:4px solid var(--gold);color:#fff}.payment-card.total .pay-name,.payment-card.total .pay-ratio,.payment-card.total .pay-amount{color:#fff}.payment-card.total .pay-amount{font-size:24px}
    .actions{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:10px 16px 14px;background:rgba(255,255,255,.92);border-top:1px solid var(--line)}.action-btn{border:0;border-radius:15px;padding:13px 10px;font-size:13px;letter-spacing:1px;font-weight:900;cursor:pointer;transition:.18s ease}.primary{background:linear-gradient(135deg,#2faf48 0%,#155d31 100%);color:#fff;box-shadow:0 10px 22px rgba(21,93,49,.20)}.secondary{background:#fffef7;border:1px solid #dfe7b9;color:#405448}.action-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.print-page{display:none}
    @media(max-width:640px){body,html{overflow:hidden}.app{width:100%}.hero{height:96px;padding:14px 16px;text-align:center;align-items:center}.hero:before{left:-45px;bottom:-72px;width:120px;height:120px;opacity:.26}.hero:after{right:-50px;bottom:-80px;width:138px;height:138px;opacity:.26}.eyebrow{font-size:10px;letter-spacing:3px;margin-bottom:6px}.title{text-align:center;font-size:27px;letter-spacing:3px;white-space:nowrap}.subtitle{font-size:11px;letter-spacing:1px;margin-top:7px}.input-section{padding:10px}.form-groups{gap:10px}.form-block{padding:10px;border-radius:16px}.grid{gap:8px}.field label{font-size:11px}.field label span{font-size:9px;letter-spacing:1px}.control{min-height:42px;border-radius:12px}.control input{font-size:15px;padding:8px}.floor-btn{font-size:14px;padding:7px 0}.total-card{position:sticky;top:0;z-index:20;border-radius:16px;padding:10px 12px}.total-value{font-size:29px}.screen-title{align-items:flex-start;flex-direction:column;margin-bottom:8px}.table-section{padding:10px}.desktop-table{display:none}.payment-cards{display:grid}.actions{grid-template-columns:1fr 1fr;position:sticky;bottom:0;padding:9px 10px 12px}.actions .primary{grid-column:1 / -1;order:-1}.action-btn{padding:12px 8px;font-size:12px}}
    @page{size:A4 portrait;margin:0}
    @media print{html,body{width:210mm;height:297mm;background:#fff!important;overflow:visible!important;margin:0!important;padding:0!important}img,svg,object{display:none!important;visibility:hidden!important;width:0!important;height:0!important}.app{display:none!important}.print-page{display:block!important;width:210mm;min-height:297mm;background:#fffdf2;padding:6mm 9mm 8mm;position:relative;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-hero{height:22mm;background:radial-gradient(circle at 5% 100%,rgba(8,85,33,.92) 0 13%,transparent 14%),radial-gradient(circle at 93% 100%,rgba(13,92,35,.92) 0 16%,transparent 17%),linear-gradient(135deg,#e0e700,#d5df00);border-bottom:1.2mm solid var(--gold);position:relative;overflow:hidden;color:#231f1c;padding:3mm 7mm;display:flex;flex-direction:column;align-items:center;justify-content:center}.print-eyebrow{position:absolute;left:7mm;top:9.5mm;z-index:1;font-size:6.5pt;letter-spacing:3px;color:#90651f;font-weight:900}.print-logo{position:relative;z-index:1;text-align:center;margin:0;font-size:19pt;letter-spacing:3px;font-weight:900;line-height:1;color:#231f1c}.print-logo small{display:block;margin-top:1.2mm;font-size:6.5pt;letter-spacing:5px;color:#231f1c}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin-top:3.2mm}.summary-card{background:#fff;border:1px solid #dfe7b9;border-radius:3mm;padding:3mm 4mm;min-height:18mm}.summary-title{font-size:8pt;color:#90651f;font-weight:900;letter-spacing:1px;margin-bottom:1.6mm}.summary-line{display:flex;justify-content:space-between;gap:8mm;font-size:9pt;font-weight:900;color:#17211a;padding:.8mm 0;border-top:1px solid rgba(223,231,185,.62)}.summary-line:first-of-type{border-top:0}.summary-line span:first-child{color:#4d634d}.summary-line span:last-child{text-align:right;white-space:nowrap}.report-head{display:flex;align-items:flex-end;justify-content:space-between;margin:4mm 0 2mm}.report-head h1{margin:0;font-size:15pt;letter-spacing:1px;color:#173321;font-weight:900}.report-time{font-size:7.5pt;color:#667363;font-weight:900}.print-table{width:100%;border-collapse:collapse;background:#fff;font-size:8.6pt}.print-table th,.print-table td{border:1px solid #e1e7c8;padding:2.4mm 3mm}.print-table th{background:#f4f8df;color:#293c38;font-weight:900;text-align:left}.print-table td{font-weight:900;color:#1b2c28}.print-table .p-ratio{text-align:right;width:32mm;font-size:8pt;white-space:nowrap}.print-table .p-amount{text-align:right;width:25mm;font-size:12.5pt;font-weight:900;white-space:nowrap}.print-total td{background:linear-gradient(135deg,#236238,#0f4c2b)!important;color:#fff!important;border-top:1.5mm solid var(--gold)!important;padding:3.4mm 3mm!important}.print-total .total-word{font-size:13pt}.print-total .p-ratio{font-size:10pt;color:#fff!important}.print-total .p-amount{font-size:18pt;color:#fff!important}.print-footer{position:absolute;left:9mm;right:9mm;bottom:6mm;display:flex;justify-content:space-between;gap:8mm;font-size:7pt;color:#56625f;font-weight:700}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero"><div class="eyebrow">PAYMENT CALCULATOR</div><h1 class="title">弘峻莊園</h1><div class="subtitle">JADE GARDEN｜專屬拆款計算機</div></header>
    <main class="content">
      <section class="input-section">
        <div class="form-groups">
          <div class="form-block"><h3 class="block-title">基本資料</h3><div class="grid"><div class="field"><label>戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" type="text" placeholder="例如 A1-5F" autocomplete="off"></div></div><div class="field"><label>坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" placeholder="0.00" step="0.01" inputmode="decimal"><b class="unit">坪</b></div></div></div></div>
          <div class="form-block"><h3 class="block-title">車位資料</h3><div class="grid"><div class="field"><label>車位樓層 <span>FLOOR</span></label><div class="control"><div class="floor-toggle"><button class="floor-btn active" type="button" data-floor="B1">B1</button><button class="floor-btn" type="button" data-floor="B2">B2</button></div></div></div><div class="field"><label>車位編號 <span>NUMBER</span></label><div class="control"><input id="parkingNumberInput" type="text" placeholder="例如 321" autocomplete="off"></div></div></div></div>
          <div class="form-block"><h3 class="block-title">價格資料</h3><div class="grid"><div class="field"><label>房屋價格 <span>HOUSE</span></label><div class="control"><input id="housePriceInput" type="number" value="733" placeholder="0" inputmode="numeric"><b class="unit">萬</b></div></div><div class="field"><label>車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" placeholder="0" inputmode="numeric"><b class="unit">萬</b></div></div></div><div class="total-card"><div><div class="total-label">總價</div><div class="total-sub">房屋價格＋車位價格</div></div><div class="total-value"><span id="screenTotalValue">733</span><small>萬</small></div></div><div id="statusBox" class="status"></div></div>
        </div>
      </section>
      <section class="table-section"><div class="screen-title"><h2>拆款計算明細</h2><span class="time" id="screenTime"></span></div><table class="desktop-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="screenRows"></tbody><tfoot><tr class="screen-total"><td>總價</td><td class="ratio">100%</td><td class="amount" id="screenTotalAmount">733 萬</td></tr></tfoot></table><div class="payment-cards" id="paymentCards"></div></section>
    </main>
    <div class="actions"><button id="printBtn" class="action-btn primary" type="button">產生正式報表</button><button id="copyBtn" class="action-btn secondary" type="button">複製摘要</button><button id="resetBtn" class="action-btn secondary" type="button">清空資料</button></div>
  </div>
  <section class="print-page"><div class="print-hero"><div class="print-eyebrow">PAYMENT CALCULATOR</div><div class="print-logo">弘峻莊園<small>JADE GARDEN</small></div></div><div class="summary-grid"><div class="summary-card"><div class="summary-title">房屋資料</div><div class="summary-line"><span>戶別</span><span id="printUnit">—</span></div><div class="summary-line"><span>坪數</span><span><span id="printSize">—</span> 坪</span></div><div class="summary-line"><span>房屋價格</span><span><span id="printHousePrice">—</span> 萬</span></div></div><div class="summary-card"><div class="summary-title">車位資料</div><div class="summary-line"><span>車位</span><span id="printParking">—</span></div><div class="summary-line"><span>車位價格</span><span><span id="printParkingPrice">—</span> 萬</span></div></div></div><div class="report-head"><h1>拆款計算報表</h1><div class="report-time" id="printTime"></div></div><table class="print-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="printRows"></tbody><tfoot><tr class="print-total"><td><div class="total-word">總價</div></td><td class="p-ratio">100%</td><td class="p-amount" id="printTotalAmount">733 萬</td></tr></tfoot></table><div class="print-footer"><div>所有金額單位：萬元</div><div>本報表由弘峻莊園拆款計算機產生</div></div></section>
<script>
const els={unit:document.getElementById('unitInput'),size:document.getElementById('sizeInput'),house:document.getElementById('housePriceInput'),parkNo:document.getElementById('parkingNumberInput'),parkPrice:document.getElementById('parkPriceInput'),status:document.getElementById('statusBox'),printBtn:document.getElementById('printBtn'),copyBtn:document.getElementById('copyBtn'),resetBtn:document.getElementById('resetBtn')};
let parkingFloor='B1';let lastState=null;
const DEFAULTS={unit:'',size:'',house:'733',parkNo:'',parkPrice:'',floor:'B1'};
function money(n){return Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0});}
function nowText(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
function safe(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));}
function parseMoney(el){return Math.max(0,parseFloat(el.value)||0);}
function setFloor(f){parkingFloor=f;document.querySelectorAll('.floor-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.floor===f));calculate();}
function buildPayments(total){
  const deposit=2,sign=8;
  const startWork=Math.max(0,Math.ceil(total*.05)-deposit-sign);
  const foundation=Math.round(total*.02),firstFloor=Math.round(total*.02),rf1=Math.round(total*.02),rf2=Math.round(total*.02);
  const loan=Math.floor(total*.80),handover=Math.ceil(total*.05);
  // 第五期工程款畫面顯示 2%，實際為尾差補足，確保合計等於總價。
  const rf3=total-(deposit+sign+startWork+foundation+firstFloor+rf1+rf2+loan+handover);
  return [
    {name:'訂金',ratio:'',amount:deposit},{name:'簽約金',ratio:'',amount:sign},{name:'開工款',ratio:'5% - 10萬',amount:startWork},
    {name:'第一期工程款－基礎開挖完成',ratio:'2%',amount:foundation},{name:'第二期工程款－一樓底版完成',ratio:'2%',amount:firstFloor},{name:'第三期工程款－第一區RF完成',ratio:'2%',amount:rf1},{name:'第四期工程款－第二區RF完成',ratio:'2%',amount:rf2},{name:'第五期工程款－第三區RF完成',ratio:'2%',amount:rf3},{name:'銀行貸款',ratio:'80%',amount:loan},{name:'交屋保留款',ratio:'5%',amount:handover}
  ];
}
function showStatus(type,msg){els.status.className=`status show ${type}`;els.status.textContent=msg;}
function renderRows(rows,total){
  document.getElementById('screenRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="ratio">${safe(r.ratio)}</td><td class="amount">${money(r.amount)} 萬</td></tr>`).join('');
  document.getElementById('paymentCards').innerHTML=rows.map(r=>`<div class="payment-card"><div class="pay-name">${safe(r.name)}</div><div class="pay-meta"><span class="pay-ratio">${safe(r.ratio)||'—'}</span><span class="pay-amount">${money(r.amount)} 萬</span></div></div>`).join('')+`<div class="payment-card total"><div class="pay-name">總價</div><div class="pay-meta"><span class="pay-ratio">100%</span><span class="pay-amount">${money(total)} 萬</span></div></div>`;
  document.getElementById('printRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="p-ratio">${safe(r.ratio)}</td><td class="p-amount">${money(r.amount)} 萬</td></tr>`).join('');
}
function calculate(){
  const housePrice=parseMoney(els.house),parkingPrice=parseMoney(els.parkPrice),total=Math.round(housePrice+parkingPrice);
  const unit=els.unit.value.trim()||'—',size=els.size.value||'—',parkingNo=els.parkNo.value.trim();
  const parkingText=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`;
  const rows=buildPayments(total),sum=rows.reduce((a,r)=>a+r.amount,0),valid=total>0&&sum===total&&rows.every(r=>Number.isFinite(r.amount)&&r.amount>=0);
  document.getElementById('screenTotalValue').textContent=money(total);document.getElementById('screenTotalAmount').textContent=money(total)+' 萬';document.getElementById('printTotalAmount').textContent=money(total)+' 萬';
  document.getElementById('printUnit').textContent=unit;document.getElementById('printSize').textContent=size;document.getElementById('printHousePrice').textContent=els.house.value===''?'—':money(Math.round(housePrice));document.getElementById('printParking').textContent=parkingText;document.getElementById('printParkingPrice').textContent=els.parkPrice.value===''?'—':money(Math.round(parkingPrice));
  const t=nowText();document.getElementById('screenTime').textContent=t;document.getElementById('printTime').textContent=t;renderRows(rows,total);
  if(total<=0){showStatus('warn','請輸入房屋價格後再產生報表。')}else if(sum!==total){showStatus('error',`拆款合計異常：目前合計 ${money(sum)} 萬，總價 ${money(total)} 萬。`)}else{showStatus('ok','拆款合計已對齊總價，可列印或複製摘要。')}
  els.printBtn.disabled=!valid;els.copyBtn.disabled=total<=0;
  lastState={unit,size,parkingText,housePrice,parkingPrice,total,rows,valid};return lastState;
}
function copySummary(){const s=calculate();if(!s||s.total<=0)return;const body=[`弘峻莊園｜付款試算`,`戶別：${s.unit}`,`坪數：${s.size} 坪`,`房屋價格：${money(s.housePrice)} 萬`,`車位：${s.parkingText}`,`車位價格：${s.parkingPrice?money(s.parkingPrice)+' 萬':'—'}`,`總價：${money(s.total)} 萬`,'',...s.rows.map(r=>`${r.name}${r.ratio?`（${r.ratio}）`:''}：${money(r.amount)} 萬`)].join('\n');navigator.clipboard?.writeText(body).then(()=>showStatus('ok','已複製付款摘要，可直接貼到 LINE。')).catch(()=>showStatus('warn','此瀏覽器不支援自動複製，請改用截圖或列印。'));}
function clearData(){els.unit.value='';els.size.value='';els.house.value='';els.parkNo.value='';els.parkPrice.value='';setFloor('B1');els.house.focus();}
function printReport(){const s=calculate();if(!s.valid){showStatus('error','目前資料未通過檢查，請確認總價與拆款合計。');return}showStatus('ok','正在產生正式報表…');setTimeout(()=>window.print(),180);}
document.querySelectorAll('.floor-btn').forEach(btn=>btn.addEventListener('click',()=>setFloor(btn.dataset.floor)));
[els.unit,els.size,els.house,els.parkNo,els.parkPrice].forEach(el=>el.addEventListener('input',calculate));
els.printBtn.addEventListener('click',printReport);els.copyBtn.addEventListener('click',copySummary);els.resetBtn.addEventListener('click',clearData);calculate();
</script>
</body>
</html>
