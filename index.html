      .print-brand{position:relative;z-index:1}.print-eyebrow{font-size:7pt;letter-spacing:3.2px;color:#90651f;font-weight:900;text-transform:uppercase;margin-bottom:2mm}.print-logo{font-size:15pt;letter-spacing:2.4px;font-weight:900;color:#173321;line-height:1}.print-logo small{display:block;margin-top:1.3mm;font-size:6.8pt;letter-spacing:4.5px;color:#36483c}.print-doc-title{position:relative;z-index:1;text-align:right}.print-doc-title h1{margin:0;font-size:21pt;letter-spacing:1.2px;color:#17211a;font-weight:900}.print-doc-title small{display:block;margin-top:1.5mm;font-size:7pt;letter-spacing:2px;color:#5f6b5f;font-weight:900;text-transform:uppercase}

      .print-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:8.6pt;border:1px solid #dde8c2;border-radius:4mm;overflow:hidden;position:relative;z-index:1;box-shadow:0 1.2mm 5mm rgba(31,62,31,.05)}.print-table th,.print-table td{border-right:1px solid #e6ecd0;border-bottom:1px solid #e6ecd0;padding:2.45mm 3.1mm}.print-table th:last-child,.print-table td:last-child{border-right:0}.print-table th{background:linear-gradient(180deg,#eef5d8,#e5efc8);color:#293c38;font-weight:900;text-align:left;font-size:8pt;letter-spacing:.6px}.print-table tbody tr:nth-child(even) td{background:#fffdf7}.print-table tbody tr:nth-child(3) td,.print-table tbody tr:nth-child(9) td,.print-table tbody tr:nth-child(10) td{background:#fbf7e9}.print-table td{font-weight:900;color:#1b2c28}.print-table .p-ratio{text-align:right;width:32mm;font-size:8.2pt;line-height:1.25;white-space:nowrap;color:#536451}.print-table .p-amount{text-align:right;width:25mm;font-size:13pt;font-weight:900;white-space:nowrap;color:#17211a}.print-total td{background:linear-gradient(135deg,#1f6137,#0c4929)!important;color:#fff!important;border-top:1.6mm solid var(--gold)!important;padding:4mm 3.1mm!important}.print-total .total-word{font-size:14pt;line-height:1;font-weight:900;letter-spacing:.6px}.print-total .p-ratio{font-size:10pt;color:#fff!important}.print-total .p-amount{font-size:20pt;color:#fff!important}

    }

<body>
  <div class="app">
    <header class="hero"><div class="eyebrow">PAYMENT CALCULATOR</div><h1 class="title">弘峻莊園</h1><div class="subtitle">JADE GARDEN｜專屬拆款計算機</div></header>
    <main class="content">
      <section class="input-section">
        <div class="form-groups">
          <div class="form-block"><h3 class="block-title">01 基本資料</h3><div class="grid"><div class="field"><label>戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" type="text" placeholder="例如 A3-4" oninput="calculate()"></div></div><div class="field"><label>坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" placeholder="0.00" step="0.01" inputmode="decimal" oninput="calculate()"><b class="unit">坪</b></div></div></div></div>
          <div class="form-block"><h3 class="block-title">02 車位資料</h3><div class="grid"><div class="field"><label>車位樓層 <span>FLOOR</span></label><div class="control"><div class="floor-toggle"><button class="floor-btn active" type="button" data-floor="B1" onclick="setFloor('B1')">B1</button><button class="floor-btn" type="button" data-floor="B2" onclick="setFloor('B2')">B2</button></div></div></div><div class="field"><label>車位編號 <span>NUMBER</span></label><div class="control"><input id="parkingNumberInput" type="text" placeholder="例如 245" oninput="calculate()"></div></div></div></div>
          <div class="form-block"><h3 class="block-title">03 價格資料</h3><div class="grid"><div class="field"><label>房屋價格 <span>HOUSE</span></label><div class="control"><input id="housePriceInput" type="number" value="733" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div><div class="field"><label>車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div></div><div class="total-card"><div><div class="total-label">總價</div><div class="total-sub">房屋價格＋車位價格</div></div><div class="total-value"><span id="screenTotalValue">733</span><small>萬</small></div></div><div class="status" id="statusBox"></div></div>
        </div>
      </section>
      <section class="table-section"><div class="screen-title"><h2>拆款計算明細</h2><span class="time" id="screenTime"></span></div><table class="desktop-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="screenRows"></tbody><tfoot><tr class="screen-total"><td>總價</td><td class="ratio">100%</td><td class="amount" id="screenTotalAmount">733 萬</td></tr></tfoot></table><div class="payment-cards" id="paymentCards"></div></section>
    </main>
    <div class="actions"><button id="printBtn" class="action-btn primary" type="button">產生正式報表</button><button id="copyBtn" class="action-btn secondary" type="button">複製摘要</button><button id="clearBtn" class="action-btn secondary" type="button">清空資料</button></div>
  </div>
  <section class="print-page"><div class="print-hero"><div class="print-brand"><div class="print-eyebrow">PAYMENT CALCULATOR</div><div class="print-logo">弘峻莊園<small>JADE GARDEN</small></div></div><div class="print-doc-title"><h1>付款試算單</h1><small>Payment Estimate</small></div></div><div class="summary-grid"><div class="summary-card"><div class="summary-title">房屋資料</div><div class="summary-body"><div class="summary-line"><span>戶別</span><span id="printUnit">—</span></div><div class="summary-line"><span>坪數</span><span><span id="printSize">—</span> 坪</span></div><div class="summary-line highlight"><span>房屋價格</span><span><span id="printHousePrice">—</span> 萬</span></div></div></div><div class="summary-card"><div class="summary-title">車位資料</div><div class="summary-body"><div class="summary-line"><span>車位</span><span id="printParking">—</span></div><div class="summary-line highlight"><span>車位價格</span><span><span id="printParkingPrice">—</span> 萬</span></div></div></div></div><div class="report-head"><h1>拆款計算明細</h1><div class="report-time" id="printTime"></div></div><table class="print-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="printRows"></tbody><tfoot><tr class="print-total"><td><div class="total-word">總價</div></td><td class="p-ratio">100%</td><td class="p-amount" id="printTotalAmount">733 萬</td></tr></tfoot></table><div class="print-footer"><div class="footer-unit">所有金額單位：萬元</div><div class="footer-brand">本報表由弘峻莊園拆款計算機產生</div></div></section>
<script>
let parkingFloor='B1';
let latestRows=[];let latestTotal=0;let latestValid=false;
function $(id){return document.getElementById(id)}
function setFloor(f){parkingFloor=f;document.querySelectorAll('.floor-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.floor===f));calculate()}
function money(n){return Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0})}
function nowText(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function safe(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function showStatus(type,text){const box=$('statusBox');box.className='status show '+type;box.textContent=text}
function calculate(){
  const unit=$('unitInput').value.trim()||'—';const sizeRaw=$('sizeInput').value;const size=sizeRaw||'—';const housePriceRaw=$('housePriceInput').value;const housePrice=parseFloat(housePriceRaw)||0;const parkingNo=$('parkingNumberInput').value.trim();const parkingText=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`;const parkingPriceRaw=$('parkPriceInput').value;const parkingPrice=parseFloat(parkingPriceRaw)||0;const total=Math.round(housePrice+parkingPrice);
  const deposit=2,sign=8,startWork=Math.max(0,Math.ceil(total*.05)-deposit-sign),foundation=Math.round(total*.02),firstFloor=Math.round(total*.02),rf1=Math.round(total*.02),rf2=Math.round(total*.02),loan=Math.floor(total*.80),handover=Math.ceil(total*.05);const rf3=total-(deposit+sign+startWork+foundation+firstFloor+rf1+rf2+loan+handover);
  const rows=[{name:'訂金',ratio:'',amount:deposit},{name:'簽約金',ratio:'',amount:sign},{name:'開工款',ratio:'5% - 10萬',amount:startWork},{name:'第一期工程款－基礎開挖完成',ratio:'2%',amount:foundation},{name:'第二期工程款－一樓底版完成',ratio:'2%',amount:firstFloor},{name:'第三期工程款－第一區RF完成',ratio:'2%',amount:rf1},{name:'第四期工程款－第二區RF完成',ratio:'2%',amount:rf2},{name:'第五期工程款－第三區RF完成',ratio:'2%',amount:rf3},{name:'銀行貸款',ratio:'80%',amount:loan},{name:'交屋保留款',ratio:'5%',amount:handover}];
  const sum=rows.reduce((a,r)=>a+r.amount,0);latestRows=rows;latestTotal=total;latestValid=housePrice>0&&sum===total;
  $('screenRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="ratio">${safe(r.ratio)}</td><td class="amount">${money(r.amount)} 萬</td></tr>`).join('');
  $('paymentCards').innerHTML=rows.map(r=>`<div class="payment-card"><div class="pay-name">${safe(r.name)}</div><div class="pay-meta"><span class="pay-ratio">${safe(r.ratio)}</span><span class="pay-amount">${money(r.amount)} 萬</span></div></div>`).join('')+`<div class="payment-card total"><div class="pay-name">總價</div><div class="pay-meta"><span class="pay-ratio">100%</span><span class="pay-amount">${money(total)} 萬</span></div></div>`;
  $('printRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="p-ratio">${safe(r.ratio)}</td><td class="p-amount">${money(r.amount)} 萬</td></tr>`).join('');
  $('screenTotalValue').textContent=money(total);$('screenTotalAmount').textContent=money(total)+' 萬';$('printTotalAmount').textContent=money(total)+' 萬';$('printUnit').textContent=unit;$('printSize').textContent=size;$('printHousePrice').textContent=housePriceRaw===''?'—':money(Math.round(housePrice));$('printParking').textContent=parkingText;$('printParkingPrice').textContent=parkingPriceRaw===''?'—':money(Math.round(parkingPrice));
  const t=nowText();$('screenTime').textContent=t;$('printTime').textContent=t;
  if(housePrice<=0){showStatus('warn','請輸入房屋價格後再產生正式報表');$('printBtn').disabled=true}else if(sum!==total){showStatus('error','拆款合計異常，請檢查公式設定');$('printBtn').disabled=true}else{showStatus('ok','拆款合計已核對，總價 '+money(total)+' 萬');$('printBtn').disabled=false}
}
function printReport(){calculate();if(!latestValid)return;window.print()}
function clearForm(){['unitInput','sizeInput','parkingNumberInput','parkPriceInput'].forEach(id=>$(id).value='');$('housePriceInput').value='';calculate()}
async function copySummary(){calculate();const unit=$('unitInput').value.trim()||'—';const size=$('sizeInput').value||'—';const house=$('housePriceInput').value?money(Math.round(parseFloat($('housePriceInput').value)||0))+' 萬':'—';const parkingNo=$('parkingNumberInput').value.trim();const parking=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`;const parkPrice=$('parkPriceInput').value?money(Math.round(parseFloat($('parkPriceInput').value)||0))+' 萬':'—';const text=['弘峻莊園｜付款試算','戶別：'+unit,'坪數：'+size+' 坪','房屋價格：'+house,'車位：'+parking,'車位價格：'+parkPrice,'總價：'+money(latestTotal)+' 萬','',...latestRows.map(r=>`${r.name}：${money(r.amount)} 萬`)].join('\n');try{await navigator.clipboard.writeText(text);showStatus('ok','已複製付款摘要，可直接貼到 LINE')}catch(e){showStatus('warn','瀏覽器未允許自動複製，請手動選取內容')}}
$('printBtn').addEventListener('click',printReport);$('clearBtn').addEventListener('click',clearForm);$('copyBtn').addEventListener('click',copySummary);calculate();
</script>
