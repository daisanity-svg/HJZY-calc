  <style>

    .table-section{padding:12px 16px 14px}.screen-title{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 0 10px;gap:8px}.screen-title h2{margin:0;font-size:18px;letter-spacing:1px;color:var(--jade-dark)}.screen-title .time{font-size:10px;color:#75806d;font-weight:700;white-space:nowrap}table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fffefb;border:1px solid #edf0de;border-radius:15px;overflow:hidden}th,td{border-right:1px solid #edf0de;border-bottom:1px solid #edf0de;padding:8px 9px;text-align:left}th:last-child,td:last-child{border-right:0}tbody tr:last-child td{border-bottom:0}th{background:linear-gradient(180deg,#f8fbea,#f1f7dc);color:#415148;font-weight:900}td.ratio{text-align:right;font-weight:900;width:130px;color:#385140;line-height:1.35;white-space:nowrap}td.amount{text-align:right;font-weight:900;font-size:17px;width:108px;color:#1b251d;white-space:nowrap}.screen-total td{background:linear-gradient(135deg,#236238,#0f4c2b)!important;color:#fff!important;border-top:4px solid var(--gold);font-size:17px;font-weight:900;border-bottom:0}.screen-total .amount{font-size:24px}.payment-cards{display:none;gap:8px}.payment-card{border:1px solid #edf0de;background:#fffefb;border-radius:14px;padding:10px 12px}.payment-card .pay-name{font-weight:900;color:#22372b;font-size:13px;line-height:1.45}.payment-card .pay-meta{margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center}.payment-card .pay-ratio{font-size:12px;color:#55705a;font-weight:900}.payment-card .pay-amount{font-size:18px;font-weight:900;color:#17211a;white-space:nowrap}.payment-card.total{background:linear-gradient(135deg,#236238,#0f4c2b);border-top:4px solid var(--gold);color:#fff}.payment-card.total .pay-name,.payment-card.total .pay-ratio,.payment-card.total .pay-amount{color:#fff}.payment-card.total .pay-amount{font-size:24px}

    @media print{

      .print-brand-hero:before,.print-brand-hero:after{content:"";position:absolute;bottom:-12mm;width:42mm;height:42mm;border-radius:50%;opacity:.95;mix-blend-mode:multiply;background:radial-gradient(circle at 36% 32%,rgba(145,255,130,.72) 0 18%,transparent 19%),radial-gradient(circle at 50% 50%,rgba(11,99,38,.86) 0 44%,transparent 45%),radial-gradient(circle at 68% 34%,rgba(246,255,100,.50) 0 28%,transparent 29%),radial-gradient(circle at 35% 70%,rgba(41,185,67,.65) 0 34%,transparent 35%)}

      .brand-title-print{position:relative;z-index:1;font-size:24pt;font-weight:900;letter-spacing:2.5px;line-height:1;color:#231f1c;text-shadow:0 .35mm 0 rgba(255,255,255,.16)}.brand-subtitle-print{position:relative;z-index:1;margin-top:2.2mm;font-size:9.5pt;letter-spacing:5.2px;font-weight:900;color:#231f1c}
      .print-doc-head{display:flex;align-items:flex-end;justify-content:space-between;padding:3.4mm 0 2.8mm;border-bottom:.35mm solid #dde4c8;position:relative;z-index:1}.doc-title{font-size:16pt;font-weight:900;letter-spacing:1px;color:#173321;line-height:1}.doc-subtitle{margin-top:1.1mm;font-size:7.2pt;letter-spacing:2.2px;text-transform:uppercase;color:#7a8268;font-weight:900}.report-time{font-size:7.4pt;color:#667363;font-weight:900;white-space:nowrap}
      .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:4mm;margin:4mm 0 4.2mm;position:relative;z-index:1}.summary-card{background:#fff;border:.35mm solid #dfe7b9;border-radius:3.5mm;min-height:24mm;overflow:hidden;box-shadow:0 1.2mm 4mm rgba(31,62,31,.05)}.summary-title{font-size:8pt;color:#173321;font-weight:900;letter-spacing:1px;padding:2.3mm 3.4mm;background:linear-gradient(90deg,#eff5d8,#fffdf4);border-bottom:.25mm solid #e4ebc8}.summary-body{padding:1.9mm 3.4mm 2.2mm}.summary-line{display:flex;justify-content:space-between;gap:8mm;font-size:8.8pt;font-weight:900;color:#17211a;padding:1mm 0;border-bottom:.2mm solid rgba(223,231,185,.55)}.summary-line:last-child{border-bottom:0}.summary-line span:first-child{color:#4d634d}.summary-line span:last-child{text-align:right;white-space:nowrap}.summary-line.highlight span:last-child{font-size:10.8pt;color:#143a24}
      .report-head{display:flex;align-items:flex-end;justify-content:space-between;margin:3.8mm 0 2.2mm;position:relative;z-index:1}.report-head h1{margin:0;font-size:14.5pt;letter-spacing:1px;color:#173321;font-weight:900}.report-head h1:after{content:"";display:block;width:25mm;height:.8mm;border-radius:99px;background:var(--gold);margin-top:1.4mm}
      .print-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:8.45pt;border:.35mm solid #dde8c2;border-radius:4mm;overflow:hidden;position:relative;z-index:1;box-shadow:0 1.1mm 4mm rgba(31,62,31,.045)}.print-table th,.print-table td{border-right:.2mm solid #e6ecd0;border-bottom:.2mm solid #e6ecd0;padding:2.3mm 3mm}.print-table th:last-child,.print-table td:last-child{border-right:0}.print-table th{background:linear-gradient(180deg,#eef5d8,#e5efc8);color:#293c38;font-weight:900;text-align:left;font-size:8pt;letter-spacing:.6px}.print-table tbody tr:nth-child(even) td{background:#fffdf7}.print-table tbody tr:nth-child(3) td,.print-table tbody tr:nth-child(9) td,.print-table tbody tr:nth-child(10) td{background:#fbf7e9}.print-table td{font-weight:900;color:#1b2c28}.print-table .p-ratio{text-align:right;width:32mm;font-size:8.1pt;line-height:1.25;white-space:nowrap;color:#536451}.print-table .p-amount{text-align:right;width:25mm;font-size:12.7pt;font-weight:900;white-space:nowrap;color:#17211a}.print-total td{background:linear-gradient(135deg,#1f6137,#0c4929)!important;color:#fff!important;border-top:1.5mm solid var(--gold)!important;padding:3.7mm 3mm!important}.print-total .total-word{font-size:14pt;line-height:1;font-weight:900;letter-spacing:.6px}.print-total .p-ratio{font-size:10pt;color:#fff!important}.print-total .p-amount{font-size:19.5pt;color:#fff!important}

<body>
  <div class="app">
    <header class="hero"><div class="eyebrow">PAYMENT CALCULATOR</div><h1 class="title">弘峻莊園</h1><div class="subtitle">JADE GARDEN｜專屬拆款計算機</div></header>
    <main class="content">
      <section class="input-section">
        <div class="form-groups">
          <div class="form-block"><h3 class="block-title">01 基本資料</h3><div class="grid"><div class="field"><label>戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" type="text" placeholder="例如 A3-4" oninput="calculate()"></div></div><div class="field"><label>坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" placeholder="0.00" step="0.01" inputmode="decimal" oninput="calculate()"><b class="unit">坪</b></div></div></div></div>
          <div class="form-block"><h3 class="block-title">02 車位資料</h3><div class="grid"><div class="field"><label>車位樓層 <span>FLOOR</span></label><div class="control"><div class="floor-toggle"><button class="floor-btn active" type="button" data-floor="B1" onclick="setFloor('B1')">B1</button><button class="floor-btn" type="button" data-floor="B2" onclick="setFloor('B2')">B2</button></div></div></div><div class="field"><label>車位編號 <span>NUMBER</span></label><div class="control"><input id="parkingNumberInput" type="text" placeholder="例如 245" oninput="calculate()"></div></div></div></div>
          <div class="form-block"><h3 class="block-title">03 價格資料</h3><div class="grid"><div class="field"><label>房屋價格 <span>HOUSE</span></label><div class="control"><input id="housePriceInput" type="number" value="733" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div><div class="field"><label>車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div></div><div class="total-card"><div><div class="total-label">總價</div><div class="total-sub">房屋價格＋車位價格</div></div><div class="total-value"><span id="screenTotalValue">733</span><small>萬</small></div></div><div class="status" id="statusBox"></div></div>
        </div>
      </section>
      <section class="table-section"><div class="screen-title"><h2>拆款計算明細</h2><span class="time" id="screenTime"></span></div><table class="desktop-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="screenRows"></tbody><tfoot><tr class="screen-total"><td>總價</td><td class="ratio">100%</td><td class="amount" id="screenTotalAmount">733 萬</td></tr></tfoot></table><div class="payment-cards" id="paymentCards"></div></section>
    </main>
    <div class="actions"><button id="printBtn" class="action-btn primary" type="button">產生正式報表</button><button id="copyBtn" class="action-btn secondary" type="button">複製摘要</button><button id="clearBtn" class="action-btn secondary" type="button">清空資料</button></div>
  </div>

  <section class="print-page">
    <div class="print-brand-hero"><div class="brand-soft-dot"></div><div class="brand-mark-text"></div><div class="brand-title-print">弘峻莊園</div><div class="brand-subtitle-print">JADE GARDEN</div></div>
    <div class="print-doc-head"><div><div class="doc-title">付款試算單</div><div class="doc-subtitle">Payment Estimate</div></div><div class="report-time" id="printTime"></div></div>
    <div class="summary-grid"><div class="summary-card"><div class="summary-title">房屋資料</div><div class="summary-body"><div class="summary-line"><span>戶別</span><span id="printUnit">—</span></div><div class="summary-line"><span>坪數</span><span><span id="printSize">—</span> 坪</span></div><div class="summary-line highlight"><span>房屋價格</span><span><span id="printHousePrice">—</span> 萬</span></div></div></div><div class="summary-card"><div class="summary-title">車位資料</div><div class="summary-body"><div class="summary-line"><span>車位</span><span id="printParking">—</span></div><div class="summary-line highlight"><span>車位價格</span><span><span id="printParkingPrice">—</span> 萬</span></div></div></div></div>
    <div class="report-head"><h1>拆款計算明細</h1></div>
    <table class="print-table"><thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="printRows"></tbody><tfoot><tr class="print-total"><td><div class="total-word">總價</div></td><td class="p-ratio">100%</td><td class="p-amount" id="printTotalAmount">733 萬</td></tr></tfoot></table>
    <div class="print-footer"><div class="footer-unit">所有金額單位：萬元</div><div class="footer-brand">本報表由弘峻莊園拆款計算機產生</div></div>
  </section>

<script>
let parkingFloor='B1';let latestRows=[];let latestTotal=0;let latestValid=false;
function $(id){return document.getElementById(id)}
function setFloor(f){parkingFloor=f;document.querySelectorAll('.floor-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.floor===f));calculate()}
function money(n){return Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0})}
function nowText(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`}
function safe(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
function showStatus(type,text){const box=$('statusBox');box.className='status show '+type;box.textContent=text}
function calculate(){
  const unit=$('unitInput').value.trim()||'—', sizeRaw=$('sizeInput').value, size=sizeRaw||'—', housePriceRaw=$('housePriceInput').value, housePrice=parseFloat(housePriceRaw)||0;
  const parkingNo=$('parkingNumberInput').value.trim(), parkingText=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`, parkingPriceRaw=$('parkPriceInput').value, parkingPrice=parseFloat(parkingPriceRaw)||0;
  const total=Math.round(housePrice+parkingPrice), deposit=2, sign=8, startWork=Math.max(0,Math.ceil(total*.05)-deposit-sign), foundation=Math.round(total*.02), firstFloor=Math.round(total*.02), rf1=Math.round(total*.02), rf2=Math.round(total*.02), loan=Math.floor(total*.80), handover=Math.ceil(total*.05);
  const rf3=total-(deposit+sign+startWork+foundation+firstFloor+rf1+rf2+loan+handover);
  const rows=[{name:'訂金',ratio:'',amount:deposit},{name:'簽約金',ratio:'',amount:sign},{name:'開工款',ratio:'5% - 10萬',amount:startWork},{name:'第一期工程款－基礎開挖完成',ratio:'2%',amount:foundation},{name:'第二期工程款－一樓底版完成',ratio:'2%',amount:firstFloor},{name:'第三期工程款－第一區RF完成',ratio:'2%',amount:rf1},{name:'第四期工程款－第二區RF完成',ratio:'2%',amount:rf2},{name:'第五期工程款－第三區RF完成',ratio:'2%',amount:rf3},{name:'銀行貸款',ratio:'80%',amount:loan},{name:'交屋保留款',ratio:'5%',amount:handover}];
  const sum=rows.reduce((a,r)=>a+r.amount,0);latestRows=rows;latestTotal=total;latestValid=housePrice>0&&sum===total;
  $('screenRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="ratio">${safe(r.ratio)}</td><td class="amount">${money(r.amount)} 萬</td></tr>`).join('');
  $('printRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="p-ratio">${safe(r.ratio)}</td><td class="p-amount">${money(r.amount)} 萬</td></tr>`).join('');
  $('paymentCards').innerHTML=rows.map(r=>`<div class="payment-card"><div class="pay-name">${safe(r.name)}</div><div class="pay-meta"><span class="pay-ratio">${safe(r.ratio)}</span><span class="pay-amount">${money(r.amount)} 萬</span></div></div>`).join('')+`<div class="payment-card total"><div class="pay-name">總價</div><div class="pay-meta"><span class="pay-ratio">100%</span><span class="pay-amount">${money(total)} 萬</span></div></div>`;
  $('screenTotalValue').textContent=money(total);$('screenTotalAmount').textContent=money(total)+' 萬';$('printTotalAmount').textContent=money(total)+' 萬';
  $('printUnit').textContent=unit;$('printSize').textContent=size;$('printHousePrice').textContent=housePriceRaw===''?'—':money(Math.round(housePrice));$('printParking').textContent=parkingText;$('printParkingPrice').textContent=parkingPriceRaw===''?'—':money(Math.round(parkingPrice));
  const t=nowText();$('screenTime').textContent=t;$('printTime').textContent=t;
  if(housePrice<=0) showStatus('warn','請輸入房屋價格後再產生正式報表。'); else if(sum!==total) showStatus('error',`拆款合計 ${money(sum)} 萬，與總價 ${money(total)} 萬不一致，請檢查。`); else showStatus('ok','拆款合計已核對，等於總價。');
  $('printBtn').disabled=!latestValid;
}
function printReport(){calculate();if(!latestValid){showStatus('error','資料尚未完整或合計不一致，暫時無法產生報表。');return}setTimeout(()=>window.print(),80)}
function copySummary(){calculate();const unit=$('unitInput').value.trim()||'—', size=$('sizeInput').value||'—', housePrice=parseFloat($('housePriceInput').value)||0, parkingNo=$('parkingNumberInput').value.trim(), parking=parkingNo?`${parkingFloor}-${parkingNo}`:`${parkingFloor}－未填編號`, parkingPriceRaw=$('parkPriceInput').value;
  const text=[`弘峻莊園｜付款試算`,`戶別：${unit}`,`坪數：${size} 坪`,`房屋價格：${money(Math.round(housePrice))} 萬`,`車位：${parking}`,`車位價格：${parkingPriceRaw===''?'—':money(Math.round(parseFloat(parkingPriceRaw)||0))} 萬`,`總價：${money(latestTotal)} 萬`,``,...latestRows.map(r=>`${r.name}：${money(r.amount)} 萬${r.ratio?`（${r.ratio}）`:''}`)].join('\n');
  navigator.clipboard?.writeText(text).then(()=>showStatus('ok','已複製付款摘要，可直接貼到 LINE。')).catch(()=>showStatus('warn','瀏覽器未允許自動複製，請改用手動選取。'))}
function clearForm(){['unitInput','sizeInput','parkingNumberInput','housePriceInput','parkPriceInput'].forEach(id=>$(id).value='');setFloor('B1');calculate()}
$('printBtn').addEventListener('click',printReport);$('copyBtn').addEventListener('click',copySummary);$('clearBtn').addEventListener('click',clearForm);calculate();
</script>
