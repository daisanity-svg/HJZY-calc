<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>弘峻莊園-專屬拆款系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
    :root{--brand-dark:#073f35;--brand-deep:#06362f;--brand-gold:#b9975b;--brand-light:#f6f1e7;--paper:#f6f3ec;--ink:#10231f;--muted:#66736f;--line:#ded4c3;--white:#fff;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body,html{margin:0;padding:0;width:100%;height:100%;font-family:'Noto Serif TC',serif;background:#efe6d4;color:var(--ink);overflow:hidden;}
    .app{width:min(100%,820px);height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 28px rgba(0,0,0,.08);}
    .hero{height:112px;flex-shrink:0;padding:20px 24px;background:linear-gradient(135deg,#073f35 0%,#073f35 58%,#052c27 100%);border-bottom:5px solid var(--brand-gold);position:relative;overflow:hidden;color:#fff;}
    .hero:before{content:"";position:absolute;inset:-48% -18% auto auto;width:320px;height:250px;border:2px solid rgba(185,151,91,.55);transform:rotate(17deg);}
    .hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 92px);opacity:.35;}
    .eyebrow{position:relative;z-index:1;margin:0 0 8px;font-size:12px;letter-spacing:6px;color:#e8cfaa;font-weight:900;}
    .title{position:relative;z-index:1;margin:0;font-size:34px;letter-spacing:5px;line-height:1;color:#fff;font-weight:900;}
    .subtitle{position:relative;z-index:1;margin:8px 0 0;font-size:13px;letter-spacing:2px;color:#e6ebe8;font-weight:700;}
    .input-section{flex-shrink:0;padding:12px 16px 10px;background:var(--paper);border-bottom:1px solid var(--line);}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
    .field{min-width:0;}
    .field label{display:flex;justify-content:space-between;align-items:center;margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:900;}
    .field label span{font-size:11px;letter-spacing:3px;color:#9a7f57;}
    .control{display:flex;align-items:center;min-height:43px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;}
    .control input,.control select{width:100%;border:0;outline:none;background:transparent;padding:9px 12px;font-family:'Noto Serif TC',serif;font-size:17px;font-weight:900;color:var(--ink);min-width:0;}
    .control input::placeholder{color:#b8b2a7;}
    .unit{padding:0 12px;color:#9b733c;font-size:14px;font-weight:900;white-space:nowrap;}
    .floor-toggle{display:flex;width:100%;padding:4px;gap:6px;}
    .floor-btn{flex:1;border:1px solid #d8cbb7;border-radius:8px;background:#fbf8f1;color:#66513a;font-family:'Noto Serif TC',serif;font-size:16px;font-weight:900;padding:8px 0;cursor:pointer;}
    .floor-btn.active{background:var(--brand-dark);color:#fff;border-color:var(--brand-dark);}
    .total-card{margin-top:10px;border:1px solid #d9c7a5;background:linear-gradient(90deg,#f9f4e9,#f7fbf8);border-radius:12px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;}
    .total-label{font-size:15px;font-weight:900;color:#5c6a66;}
    .total-sub{font-size:11px;color:#9a7f57;font-weight:700;margin-top:2px;}
    .total-value{font-size:32px;line-height:1;font-weight:900;color:#071d19;text-align:right;}
    .total-value small{font-size:15px;color:#9b733c;margin-left:5px;}
    .table-section{flex:1;overflow:auto;padding:10px 16px 14px;background:#fff;}
    .screen-title{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 0 9px;}
    .screen-title h2{margin:0;font-size:18px;letter-spacing:1px;color:var(--ink);}
    .screen-title .time{font-size:10px;color:#888;font-weight:700;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{border:1px solid #ebe5da;padding:8px 9px;text-align:left;}
    th{background:#faf8f2;color:#4d5b57;font-weight:900;}
    td.note{font-size:11px;color:#4d5b57;font-weight:700;}
    td.ratio{text-align:right;font-weight:900;width:100px;}
    td.amount{text-align:right;font-weight:900;font-size:17px;width:105px;}
    .ratio-lines{display:inline-block;text-align:right;line-height:1.35;}
    .screen-total td{background:var(--brand-dark)!important;color:#fff!important;border-top:4px solid var(--brand-gold);font-size:17px;font-weight:900;}
    .screen-total .amount{font-size:24px;}
    .btn-section{flex-shrink:0;padding:10px 16px 14px;background:#fff;border-top:1px solid var(--line);}
    .print-btn{width:100%;border:0;border-radius:10px;background:var(--brand-gold);color:#fff;padding:14px;font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:3px;font-weight:900;cursor:pointer;}
    .print-page{display:none;}
    @media(max-width:640px){.hero{height:96px;padding:16px 18px}.title{font-size:28px}.subtitle{font-size:12px}.eyebrow{font-size:10px}.input-section{padding:10px 10px 8px}.grid{gap:8px}.field label{font-size:11px}.field label span{font-size:9px;letter-spacing:1px}.control{min-height:39px}.control input{font-size:15px;padding:8px}.floor-btn{font-size:14px;padding:7px 0}.total-value{font-size:28px}.screen-title h2{font-size:17px}th,td{padding:7px 5px;font-size:12px}td.note{font-size:10px}td.ratio{width:64px}td.amount{width:80px;font-size:15px}.screen-total .amount{font-size:20px}}
    @page{size:A4 portrait;margin:0;}
    @media print{body,html{width:210mm;height:297mm;background:#fff!important;overflow:visible!important}.app{display:none!important}.print-page{display:block!important;width:210mm;height:297mm;background:var(--paper);padding:11mm 14mm 13mm;position:relative;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-hero{height:36mm;background:linear-gradient(135deg,#073f35,#06352f);border-bottom:2mm solid var(--brand-gold);position:relative;overflow:hidden;color:#fff;padding:7mm 8mm}.print-hero:before{content:"";position:absolute;right:-6mm;top:-16mm;width:70mm;height:54mm;border:1px solid rgba(185,151,91,.55);transform:rotate(16deg)}.print-eyebrow{position:relative;z-index:1;font-size:8.5pt;letter-spacing:4px;color:#e8cfaa;font-weight:900;margin-bottom:6mm}.print-logo{position:relative;z-index:1;text-align:center;margin-top:-2mm;font-size:25pt;letter-spacing:4px;font-weight:900;line-height:1;color:#fff}.print-logo small{display:block;margin-top:2mm;font-size:8pt;letter-spacing:7px;color:#e8e8e1}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3.5mm;margin-top:5mm}.summary-card{background:#fff;border:1px solid #ddd4c8;border-radius:2mm;padding:3mm 4mm;min-height:13mm}.summary-label{font-size:7.5pt;color:#5e6966;font-weight:900;margin-bottom:1.5mm}.summary-value{font-size:11pt;color:#0b201c;font-weight:900}.report-head{display:flex;align-items:flex-end;justify-content:space-between;margin:8mm 0 3mm}.report-head h1{margin:0;font-size:16pt;letter-spacing:1px;color:#0b201c;font-weight:900}.report-time{font-size:8pt;color:#666;font-weight:900}.print-table{width:100%;border-collapse:collapse;background:#fff;font-size:9.5pt}.print-table th,.print-table td{border:1px solid #ded8ce;padding:4.1mm 3.5mm}.print-table th{background:#f8f5ed;color:#293c38;font-weight:900;text-align:left}.print-table td{font-weight:900;color:#1b2c28}.print-table .p-note{font-size:8pt;color:#43524f;font-weight:700}.print-table .p-ratio{text-align:right;width:26mm;font-size:9pt}.print-table .p-amount{text-align:right;width:26mm;font-size:15pt;font-weight:900;white-space:nowrap}.print-total td{background:#073f35!important;color:#fff!important;border-top:2mm solid var(--brand-gold)!important;padding:5mm 3.5mm!important}.print-total .total-word{font-size:13pt;line-height:1.05}.print-total .total-word small{display:block;font-size:6.5pt;letter-spacing:1px;margin-top:1mm;color:#f1eadc}.print-total .p-ratio{font-size:11pt;color:#fff!important}.print-total .p-amount{font-size:20pt;color:#fff!important}.print-footer{position:absolute;left:14mm;right:14mm;bottom:13mm;display:flex;justify-content:space-between;font-size:7.5pt;color:#56625f;font-weight:700}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero"><div class="eyebrow">PAYMENT CALCULATOR</div><h1 class="title">弘峻莊園</h1><div class="subtitle">專屬拆款計算機</div></header>
    <section class="input-section"><div class="grid"><div class="field"><label>戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" type="text" placeholder="例如 A1-5F" oninput="calculate()"></div></div><div class="field"><label>車位樓層 <span>FLOOR</span></label><div class="control"><div class="floor-toggle"><button class="floor-btn active" type="button" data-floor="B1" onclick="setFloor('B1')">B1</button><button class="floor-btn" type="button" data-floor="B2" onclick="setFloor('B2')">B2</button></div></div></div><div class="field"><label>坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" placeholder="0.00" step="0.01" oninput="calculate()"><b class="unit">坪</b></div></div><div class="field"><label>車位編號 <span>NUMBER</span></label><div class="control"><input id="parkingNumberInput" type="text" placeholder="例如 321" oninput="calculate()"></div></div><div class="field"><label>房屋價格 <span>HOUSE</span></label><div class="control"><input id="housePriceInput" type="number" value="733" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div><div class="field"><label>車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div></div><div class="total-card"><div><div class="total-label">物業總額</div><div class="total-sub">自動帶入：房屋價格＋車位價格</div></div><div class="total-value"><span id="screenTotalValue">733</span><small>萬</small></div></div></section>
    <section class="table-section"><div class="screen-title"><h2>拆款計算明細</h2><span class="time" id="screenTime"></span></div><table><thead><tr><th>款項</th><th>備註</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="screenRows"></tbody><tfoot><tr class="screen-total"><td colspan="2">合計總額 TOTAL</td><td class="ratio">100%</td><td class="amount" id="screenTotalAmount">733 萬</td></tr></tfoot></table></section>
    <div class="btn-section"><button class="print-btn" onclick="window.print()">產生正式報表 | PRINT</button></div>
  </div>
  <section class="print-page"><div class="print-hero"><div class="print-eyebrow">PAYMENT CALCULATOR</div><div class="print-logo">弘峻莊園<small>JADE GARDEN</small></div></div><div class="summary-grid"><div class="summary-card"><div class="summary-label">戶別</div><div class="summary-value" id="printUnit">—</div></div><div class="summary-card"><div class="summary-label">坪數</div><div class="summary-value"><span id="printSize">—</span> 坪</div></div><div class="summary-card"><div class="summary-label">車位</div><div class="summary-value" id="printParking">—</div></div><div class="summary-card"><div class="summary-label">車位價</div><div class="summary-value"><span id="printParkingPrice">—</span> 萬</div></div></div><div class="report-head"><h1>拆款計算報表</h1><div class="report-time" id="printTime"></div></div><table class="print-table"><thead><tr><th>款項</th><th>備註</th><th>拆款方式</th><th>金額</th></tr></thead><tbody id="printRows"></tbody><tfoot><tr class="print-total"><td colspan="2"><div class="total-word">合計總額<small>TOTAL</small></div></td><td class="p-ratio">100%</td><td class="p-amount" id="printTotalAmount">733 萬</td></tr></tfoot></table><div class="print-footer"><div>所有金額單位：萬元</div><div>本報表由弘峻莊園拆款計算機產生</div></div></section>
<script>
let parkingFloor='B1';
function setFloor(f){parkingFloor=f;document.querySelectorAll('.floor-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.floor===f));calculate();}
function money(n){return Number(n||0).toLocaleString('zh-TW');}
function nowText(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}
function safe(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function renderRatio(text){return text==='總價6%扣除訂金' ? '<span class="ratio-lines">總價6%<br>扣除訂金</span>' : safe(text);}
function calculate(){const unit=document.getElementById('unitInput').value.trim()||'—';const sizeRaw=document.getElementById('sizeInput').value;const size=sizeRaw||'—';const housePrice=parseFloat(document.getElementById('housePriceInput').value)||0;const parkingNo=document.getElementById('parkingNumberInput').value.trim();const parkingText=parkingNo?`${parkingFloor}-${parkingNo}`:parkingFloor;const parkingPriceRaw=document.getElementById('parkPriceInput').value;const parkingPrice=parseFloat(parkingPriceRaw)||0;const total=housePrice+parkingPrice;const deposit=5;const sign=Math.ceil(total*.06)-deposit;const e1=Math.round(total*.02),e2=Math.round(total*.02),e3=Math.round(total*.02);const loan=Math.floor(total*.80);const handover=Math.ceil(total*.05);const seal=total-(deposit+sign+e1+e2+e3+loan+handover);const rows=[{name:'訂金',note:'—',ratio:'固定5萬',amount:deposit},{name:'簽約金',note:'—',ratio:'總價6%扣除訂金',amount:sign},{name:'工程期款第一期',note:'第一區屋頂版完成，開工後約第19個月',ratio:'2%',amount:e1},{name:'工程期款第二期',note:'第二區屋頂版完成，開工後約第26個月',ratio:'2%',amount:e2},{name:'工程期款第三期',note:'第三區屋頂版完成，開工後約第32個月',ratio:'2%',amount:e3},{name:'落架款',note:'全區落架完成，開工後約第40個月',ratio:'3%',amount:seal},{name:'銀行貸款',note:'—',ratio:'80%',amount:loan},{name:'交屋保留款',note:'—',ratio:'5%',amount:handover}];document.getElementById('screenRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="note">${safe(r.note)}</td><td class="ratio">${renderRatio(r.ratio)}</td><td class="amount">${money(r.amount)} 萬</td></tr>`).join('');document.getElementById('printRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="p-note">${safe(r.note)}</td><td class="p-ratio">${renderRatio(r.ratio)}</td><td class="p-amount">${money(r.amount)} 萬</td></tr>`).join('');document.getElementById('screenTotalValue').textContent=money(total);document.getElementById('screenTotalAmount').textContent=money(total)+' 萬';document.getElementById('printTotalAmount').textContent=money(total)+' 萬';document.getElementById('printUnit').textContent=unit;document.getElementById('printSize').textContent=size;document.getElementById('printParking').textContent=parkingText;document.getElementById('printParkingPrice').textContent=parkingPriceRaw===''?'—':money(parkingPrice);const t=nowText();document.getElementById('screenTime').textContent=t;document.getElementById('printTime').textContent=t;}
calculate();
</script>
</body>
</html>
