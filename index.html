
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>弘峻莊園-專屬拆款系統</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');

        :root {
            --brand-gold: #b5945d;
            --brand-dark: #1a302b;
            --brand-light: #f9f7f2;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Noto Serif TC', serif;
            background-color: #fff;
        }

        .phone-container {
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* 標頭區域 */
        .header-container {
            flex-shrink: 0;
            width: 100%;
            height: 25dvh;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--brand-gold);
        }

        .header-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 48, 43, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .brand-title {
            margin: 0;
            font-size: 28px;
            letter-spacing: 10px;
            color: var(--brand-gold);
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        /* 新增：戶別與車位顯示區 (僅在列印時顯示) */
        .print-info-display {
            display: none;
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: white;
            font-size: 14px;
            text-align: right;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* 輸入區域 */
        .input-section {
            padding: 10px 15px;
            background: var(--brand-light);
            flex-shrink: 0;
            border-bottom: 1px solid #ddd;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            color: #777;
            margin-bottom: 2px;
        }

        .input-group input {
            padding: 4px;
            border: none;
            border-bottom: 1px solid var(--brand-gold);
            background: transparent;
            font-family: 'Noto Serif TC', serif;
            outline: none;
            font-size: 15px;
            color: var(--brand-dark);
        }

        .total-input-group {
            text-align: center;
            margin-top: 5px;
        }

        .total-input-group input {
            width: 150px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-bottom: 2px solid var(--brand-gold);
            background: transparent;
            outline: none;
        }

        /* 表格區域 */
        .table-section {
            flex-grow: 1;
            padding: 5px 15px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        td {
            padding: 9px 5px;
            border-bottom: 1px solid #eee;
        }

        .col-name { font-weight: 700; color: var(--brand-dark); }
        .col-ratio { color: #888; text-align: center; width: 50px; }
        .col-val { text-align: right; font-weight: 700; width: 110px; color: #000; }

        .total-row {
            background-color: var(--brand-dark) !important;
            color: #ffffff !important;
        }

        .total-row td {
            padding: 15px 5px;
            border-top: 2px solid var(--brand-gold);
            font-weight: 700;
            font-size: 16px;
        }

        /* 按鈕區域 */
        .btn-section {
            padding: 10px 20px 15px;
            flex-shrink: 0;
        }

        .print-btn {
            width: 100%;
            background-color: var(--brand-gold);
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            letter-spacing: 2px;
            border-radius: 4px;
            font-family: 'Noto Serif TC', serif;
            font-weight: bold;
            cursor: pointer;
        }

        /* 列印樣式優化 */
        @media print {
            body, html { overflow: visible !important; height: auto !important; }
            .phone-container { height: auto !important; display: block !important; }
            .btn-section, .input-section { display: none !important; }
            .header-container { height: 180px !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-info-display { display: block !important; }
            .total-row { background-color: #1a302b !important; color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            td { border-bottom: 1px solid #eee !important; }
        }

        @media screen and (max-height: 700px) {
            .header-container { height: 22dvh; }
            td { padding: 6px 5px; font-size: 13px; }
            .brand-title { font-size: 22px; }
        }
    </style>
</head>

        <div class="header-overlay">
            <h1 class="brand-title">弘峻莊園</h1>
            <!-- 列印時會顯示在此處 -->
            <div id="printInfo" class="print-info-display"></div>
        </div>
    </div>

    <!-- 新增輸入區域 -->
    <div class="input-section">
        <div class="input-grid">
            <div class="input-group">
                <label>戶別 (例：A1-8F)</label>
                <input type="text" id="unitName" placeholder="請輸入戶別" oninput="updatePrintInfo()">
            </div>
            <div class="input-group">
                <label>車位 (例：B2-105)</label>
                <input type="text" id="parkingSpace" placeholder="請輸入車位" oninput="updatePrintInfo()">
            </div>
        </div>
        <div class="total-input-group">
            <label style="font-size:11px; color:#777; display:block;">物業總價 (萬元)</label>
            <input type="number" id="totalPrice" value="733" oninput="calculate()" pattern="[0-9]*" inputmode="numeric">
        </div>
    </div>

    <div class="table-section">
        <table>
            <tbody id="resultList"></tbody>
            <tfoot>
                <tr class="total-row">
                    <td>合計總額 (TOTAL)</td>
                    <td class="col-ratio">100%</td>
                    <td class="col-val" id="finalSum" style="color:white;">0 萬</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="btn-section">
        <button class="print-btn" onclick="window.print()">產生報表 | PRINT</button>
    </div>
</div>

<script>
    function updatePrintInfo() {
        const unit = document.getElementById('unitName').value;
        const parking = document.getElementById('parkingSpace').value;
        let infoHtml = "";
        if(unit) infoHtml += `戶別：${unit}<br>`;
        if(parking) infoHtml += `車位：${parking}`;
        document.getElementById('printInfo').innerHTML = infoHtml;
    }

    function calculate() {
        const inputTotal = parseFloat(document.getElementById('totalPrice').value) || 0;
        const deposit = 5;
        const contract = Math.ceil(inputTotal * 0.06) - deposit;
        const eng1 = Math.round(inputTotal * 0.02);
        const eng2 = Math.round(inputTotal * 0.02);
        const eng3 = Math.round(inputTotal * 0.02);
        const loan = Math.floor(inputTotal * 0.80);
        const handOver = Math.ceil(inputTotal * 0.05);
        const allocated = deposit + contract + eng1 + eng2 + eng3 + loan + handOver;
        const balance = inputTotal - allocated;

        const data = [
            { n: "訂金", r: "固定", v: deposit },
            { n: "簽約金", r: "6%", v: contract },
            { n: "工程款 (一期)", r: "2%", v: eng1 },
            { n: "工程款 (二期)", r: "2%", v: eng2 },
            { n: "工程款 (三期)", r: "2%", v: eng3 },
            { n: "備證用印款", r: "3%", v: balance },
            { n: "銀行貸款", r: "80%", v: loan },
            { n: "交屋保留款", r: "5%", v: handOver }
        ];

        let rows = "";
        data.forEach(d => {
            rows += `<tr>
                <td class="col-name">${d.n}</td>
                <td class="col-ratio">${d.r}</td>
                <td class="col-val">${d.v.toLocaleString()} 萬</td>
            </tr>`;
        });

        document.getElementById('resultList').innerHTML = rows;
        document.getElementById('finalSum').innerText = inputTotal.toLocaleString() + " 萬";
    }

    // 初始執行
    calculate();
</script>

</body>
</html>
