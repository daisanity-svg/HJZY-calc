<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>弘峻莊園-專屬拆款系統</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap');
    :root{
      --lime:#dce400;
      --lime-soft:#f5f8d5;
      --jade:#2b9b45;
      --jade-deep:#0f6030;
      --jade-dark:#163321;
      --gold:#b7812a;
      --paper:#fffdf2;
      --card:rgba(255,255,255,.92);
      --line:#dfe7b9;
      --ink:#211d1b;
      --muted:#5e6b5f;
      --shadow:0 14px 42px rgba(37,65,22,.14);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body,html{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      font-family:'Noto Serif TC',serif;
      color:var(--ink);
      overflow:hidden;
      background:
        radial-gradient(circle at 5% 86%,rgba(18,103,38,.32) 0 7%,transparent 8%),
        radial-gradient(circle at 16% 94%,rgba(70,178,65,.24) 0 9%,transparent 10%),
        radial-gradient(circle at 92% 88%,rgba(28,116,45,.28) 0 12%,transparent 13%),
        radial-gradient(circle at 82% 98%,rgba(126,235,105,.22) 0 10%,transparent 11%),
        linear-gradient(180deg,#f4f7d8 0%,#eef4c2 100%);
    }
    .app{
      width:min(100%,860px);
      height:100dvh;
      margin:0 auto;
      background:rgba(255,255,255,.76);
      backdrop-filter:blur(14px);
      display:flex;
      flex-direction:column;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .app:before{content:"";position:absolute;inset:auto -70px -90px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(124,235,102,.26),transparent 64%);pointer-events:none;}
    .hero{
      height:134px;
      flex-shrink:0;
      padding:20px 24px;
      position:relative;
      overflow:hidden;
      color:var(--ink);
      border-bottom:4px solid rgba(183,129,42,.55);
      background:
        radial-gradient(circle at 6% 100%,rgba(6,82,32,.96) 0 11%,transparent 12%),
        radial-gradient(circle at 13% 88%,rgba(224,255,70,.54) 0 11%,transparent 12%),
        radial-gradient(circle at 91% 100%,rgba(12,92,35,.95) 0 16%,transparent 17%),
        radial-gradient(circle at 86% 78%,rgba(241,255,110,.48) 0 10%,transparent 11%),
        linear-gradient(135deg,#e2e800 0%,#dce400 58%,#cfdc00 100%);
    }
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:multiply;}
    .hero:before{left:-62px;bottom:-76px;width:210px;height:210px;background:conic-gradient(from 45deg,rgba(117,255,96,.82),rgba(0,86,31,.84),rgba(229,255,62,.55),rgba(26,126,44,.88),rgba(117,255,96,.82));opacity:.9;}
    .hero:after{right:-62px;bottom:-92px;width:270px;height:270px;background:conic-gradient(from 25deg,rgba(126,255,112,.76),rgba(15,103,38,.88),rgba(232,255,80,.56),rgba(40,154,58,.86),rgba(126,255,112,.76));opacity:.92;}
    .brand-mark{position:relative;z-index:1;margin:0 auto 5px;width:40px;height:25px;display:grid;place-items:center;color:var(--gold);font-size:24px;line-height:1;}
    .brand-mark:before{content:"✤";font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.35);}
    .eyebrow{position:relative;z-index:1;margin:0 0 8px;font-size:12px;letter-spacing:5px;color:#90651f;font-weight:900;text-transform:uppercase;}
    .title{position:relative;z-index:1;margin:0;text-align:left;font-size:34px;letter-spacing:5px;line-height:1;color:#231f1c;font-weight:900;text-shadow:0 1px 0 rgba(255,255,255,.25);}
    .subtitle{position:relative;z-index:1;margin:9px 0 0;font-size:13px;letter-spacing:2px;color:#45523c;font-weight:900;}
    .input-section{flex-shrink:0;padding:14px 16px 12px;background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(250,252,235,.94));border-bottom:1px solid var(--line);}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
    .field{min-width:0;}
    .field label{display:flex;justify-content:space-between;align-items:center;margin:0 0 5px;font-size:12px;color:var(--jade-dark);font-weight:900;}
    .field label span{font-size:10px;letter-spacing:2px;color:var(--gold);}
    .control{display:flex;align-items:center;min-height:46px;border:1px solid var(--line);border-radius:15px;background:var(--card);overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.88),0 5px 16px rgba(68,92,28,.05);transition:.18s ease;}
    .control:focus-within{border-color:#aec837;box-shadow:0 0 0 3px rgba(205,223,42,.18),0 8px 18px rgba(68,92,28,.08);}
    .control input{width:100%;border:0;outline:none;background:transparent;padding:10px 12px;font-family:'Noto Serif TC',serif;font-size:17px;font-weight:900;color:var(--ink);min-width:0;}
    .control input::placeholder{color:#b3bca2;}
    .unit{padding:0 12px;color:#8f641f;font-size:14px;font-weight:900;white-space:nowrap;}
    .floor-toggle{display:flex;width:100%;padding:4px;gap:6px;}
    .floor-btn{flex:1;border:1px solid #d9e1b8;border-radius:11px;background:linear-gradient(180deg,#fffef7,#f4f7e2);color:#49624d;font-family:'Noto Serif TC',serif;font-size:15px;font-weight:900;padding:8px 0;cursor:pointer;transition:.18s ease;}
    .floor-btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(37,98,43,.10);}
    .floor-btn.active{background:linear-gradient(135deg,#41b857 0%,#176a38 100%);color:#fff;border-color:#176a38;box-shadow:0 6px 16px rgba(23,106,56,.24);}
    .total-card{margin-top:12px;border:1px solid #dce5b6;background:radial-gradient(circle at 100% 0%,rgba(220,228,0,.22),transparent 34%),linear-gradient(135deg,#fffef6 0%,#f8fbe4 54%,#eef8d8 100%);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(64,91,28,.08);position:relative;overflow:hidden;}
    .total-card:after{content:"";position:absolute;right:-22px;bottom:-32px;width:112px;height:112px;border-radius:50%;background:conic-gradient(from 25deg,rgba(96,221,83,.22),rgba(9,94,36,.18),rgba(230,255,85,.24),rgba(96,221,83,.22));}
    .total-label,.total-sub,.total-value{position:relative;z-index:1;}
    .total-label{font-size:15px;font-weight:900;color:#405448;}
    .total-sub{font-size:11px;color:#7a845f;font-weight:700;margin-top:2px;}
    .total-value{font-size:35px;line-height:1;font-weight:900;color:#17211a;text-align:right;}
    .total-value small{font-size:15px;color:var(--gold);margin-left:5px;}
    .table-section{flex:1;overflow:auto;padding:12px 16px 14px;background:rgba(255,255,255,.90);}
    .screen-title{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 0 10px;gap:8px;}
    .screen-title h2{margin:0;font-size:18px;letter-spacing:1px;color:var(--jade-dark);}
    .screen-title .time{font-size:10px;color:#75806d;font-weight:700;white-space:nowrap;}
    table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;background:#fffefb;border:1px solid #edf0de;border-radius:15px;overflow:hidden;}
    th,td{border-right:1px solid #edf0de;border-bottom:1px solid #edf0de;padding:8px 9px;text-align:left;}
    th:last-child,td:last-child{border-right:0;}
    tbody tr:last-child td{border-bottom:0;}
    th{background:linear-gradient(180deg,#f8fbea,#f1f7dc);color:#415148;font-weight:900;}
    tbody tr{transition:.15s ease;}
    tbody tr:hover{background:#fbfde9;}
    td.ratio{text-align:right;font-weight:900;width:130px;color:#385140;line-height:1.35;white-space:nowrap;}
    td.amount{text-align:right;font-weight:900;font-size:17px;width:108px;color:#1b251d;white-space:nowrap;}
    .screen-total td{background:linear-gradient(135deg,#236238,#0f4c2b)!important;color:#fff!important;border-top:4px solid var(--gold);font-size:17px;font-weight:900;border-bottom:0;}
    .screen-total .amount{font-size:24px;}
    .btn-section{flex-shrink:0;padding:10px 16px 14px;background:rgba(255,255,255,.92);border-top:1px solid var(--line);}
    .print-btn{width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,#2faf48 0%,#155d31 100%);color:#fff;padding:14px;font-family:'Noto Serif TC',serif;font-size:14px;letter-spacing:3px;font-weight:900;cursor:pointer;box-shadow:0 10px 22px rgba(21,93,49,.20);transition:.18s ease;}
    .print-btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
    .print-page{display:none;}
    @media(max-width:640px){
      .app{width:100%;}
      .hero{height:112px;padding:14px 16px}
      .brand-mark{display:none}
      .title{font-size:28px;letter-spacing:3px}
      .subtitle{font-size:12px}
      .eyebrow{font-size:10px;letter-spacing:3px}
      .input-section{padding:10px}
      .grid{gap:8px}
      .field label{font-size:11px}
      .field label span{font-size:9px;letter-spacing:1px}
      .control{min-height:40px;border-radius:12px}
      .control input{font-size:15px;padding:8px}
      .floor-btn{font-size:14px;padding:7px 0}
      .total-card{border-radius:16px;padding:10px 12px}
      .total-value{font-size:29px}
      .screen-title{align-items:flex-start;flex-direction:column;margin-bottom:8px}
      .screen-title h2{font-size:17px}
      .table-section{padding:10px}
      th,td{padding:7px 6px;font-size:12px}
      td.ratio{width:86px;font-size:11px;white-space:nowrap;}
      td.amount{width:78px;font-size:14px}
      .screen-total .amount{font-size:19px}
      .print-btn{padding:13px}
    }
    @page{size:A4 portrait;margin:0;}
    @media print{
      body,html{width:210mm;height:297mm;background:#fff!important;overflow:visible!important}
      .app{display:none!important}
      .print-page{display:block!important;width:210mm;height:297mm;background:#fffdf2;padding:8mm 12mm 10mm;position:relative;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .print-hero{height:35mm;background:radial-gradient(circle at 5% 100%,rgba(8,85,33,.92) 0 13%,transparent 14%),radial-gradient(circle at 93% 100%,rgba(13,92,35,.92) 0 16%,transparent 17%),linear-gradient(135deg,#e0e700,#d5df00);border-bottom:1.5mm solid var(--gold);position:relative;overflow:hidden;color:#231f1c;padding:5mm 7mm}
      .print-eyebrow{position:relative;z-index:1;font-size:8pt;letter-spacing:4px;color:#90651f;font-weight:900;margin-bottom:8mm}
      .print-logo{position:relative;z-index:1;text-align:center;margin-top:2mm;font-size:24pt;letter-spacing:4px;font-weight:900;line-height:1;color:#231f1c}
      .print-logo small{display:block;margin-top:2mm;font-size:8pt;letter-spacing:7px;color:#231f1c}
      .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-top:4mm}
      .summary-card{background:#fff;border:1px solid #dfe7b9;border-radius:2mm;padding:2.7mm 3.5mm;min-height:12mm}
      .summary-label{font-size:7pt;color:#4d634d;font-weight:900;margin-bottom:1mm}
      .summary-value{font-size:10.5pt;color:#17211a;font-weight:900}
      .report-head{display:flex;align-items:flex-end;justify-content:space-between;margin:5mm 0 2.5mm}
      .report-head h1{margin:0;font-size:15pt;letter-spacing:1px;color:#173321;font-weight:900}
      .report-time{font-size:7.5pt;color:#667363;font-weight:900}
      .print-table{width:100%;border-collapse:collapse;background:#fff;font-size:8.5pt}
      .print-table th,.print-table td{border:1px solid #e1e7c8;padding:2.7mm 3mm}
      .print-table th{background:#f4f8df;color:#293c38;font-weight:900;text-align:left}
      .print-table td{font-weight:900;color:#1b2c28}
      .print-table .p-ratio{text-align:right;width:32mm;font-size:8pt;line-height:1.25;white-space:nowrap}
      .print-table .p-amount{text-align:right;width:24mm;font-size:12.5pt;font-weight:900;white-space:nowrap}
      .print-total td{background:linear-gradient(135deg,#236238,#0f4c2b)!important;color:#fff!important;border-top:1.7mm solid var(--gold)!important;padding:3.8mm 3mm!important}
      .print-total .total-word{font-size:13pt;line-height:1.05}
      .print-total .p-ratio{font-size:10pt;color:#fff!important}
      .print-total .p-amount{font-size:18pt;color:#fff!important}
      .print-footer{position:absolute;left:12mm;right:12mm;bottom:8mm;display:flex;justify-content:space-between;font-size:7pt;color:#56625f;font-weight:700}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="brand-mark"></div>
      <div class="eyebrow">PAYMENT CALCULATOR</div>
      <h1 class="title">弘峻莊園</h1>
      <div class="subtitle">JADE GARDEN｜專屬拆款計算機</div>
    </header>

    <section class="input-section">
      <div class="grid">
        <div class="field"><label>戶別 <span>UNIT</span></label><div class="control"><input id="unitInput" type="text" placeholder="例如 A1-5F" oninput="calculate()"></div></div>
        <div class="field"><label>車位樓層 <span>FLOOR</span></label><div class="control"><div class="floor-toggle"><button class="floor-btn active" type="button" data-floor="B1" onclick="setFloor('B1')">B1</button><button class="floor-btn" type="button" data-floor="B2" onclick="setFloor('B2')">B2</button></div></div></div>
        <div class="field"><label>坪數 <span>SIZE</span></label><div class="control"><input id="sizeInput" type="number" placeholder="0.00" step="0.01" oninput="calculate()"><b class="unit">坪</b></div></div>
        <div class="field"><label>車位編號 <span>NUMBER</span></label><div class="control"><input id="parkingNumberInput" type="text" placeholder="例如 321" oninput="calculate()"></div></div>
        <div class="field"><label>房屋價格 <span>HOUSE</span></label><div class="control"><input id="housePriceInput" type="number" value="733" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div>
        <div class="field"><label>車位價格 <span>PRICE</span></label><div class="control"><input id="parkPriceInput" type="number" placeholder="0" inputmode="numeric" oninput="calculate()"><b class="unit">萬</b></div></div>
      </div>
      <div class="total-card">
        <div>
          <div class="total-label">總價</div>
          <div class="total-sub">房屋價格＋車位價格</div>
        </div>
        <div class="total-value"><span id="screenTotalValue">733</span><small>萬</small></div>
      </div>
    </section>

    <section class="table-section">
      <div class="screen-title"><h2>拆款計算明細</h2><span class="time" id="screenTime"></span></div>
      <table>
        <thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead>
        <tbody id="screenRows"></tbody>
        <tfoot><tr class="screen-total"><td>總價</td><td class="ratio">100%</td><td class="amount" id="screenTotalAmount">733 萬</td></tr></tfoot>
      </table>
    </section>

    <div class="btn-section"><button id="printBtn" class="print-btn" type="button">產生正式報表 | PRINT</button></div>
  </div>

  <section class="print-page">
    <div class="print-hero"><div class="print-eyebrow">PAYMENT CALCULATOR</div><div class="print-logo">弘峻莊園<small>JADE GARDEN</small></div></div>
    <div class="summary-grid">
      <div class="summary-card"><div class="summary-label">戶別</div><div class="summary-value" id="printUnit">—</div></div>
      <div class="summary-card"><div class="summary-label">坪數</div><div class="summary-value"><span id="printSize">—</span> 坪</div></div>
      <div class="summary-card"><div class="summary-label">車位</div><div class="summary-value" id="printParking">—</div></div>
      <div class="summary-card"><div class="summary-label">車位價</div><div class="summary-value"><span id="printParkingPrice">—</span> 萬</div></div>
    </div>
    <div class="report-head"><h1>拆款計算報表</h1><div class="report-time" id="printTime"></div></div>
    <table class="print-table">
      <thead><tr><th>款項</th><th>拆款方式</th><th>金額</th></tr></thead>
      <tbody id="printRows"></tbody>
      <tfoot><tr class="print-total"><td><div class="total-word">總價</div></td><td class="p-ratio">100%</td><td class="p-amount" id="printTotalAmount">733 萬</td></tr></tfoot>
    </table>
    <div class="print-footer"><div>所有金額單位：萬元</div><div>本報表由弘峻莊園拆款計算機產生</div></div>
  </section>

<script>
let parkingFloor='B1';
function setFloor(f){
  parkingFloor=f;
  document.querySelectorAll('.floor-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.floor===f));
  calculate();
}
function money(n){return Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0});}
function nowText(){
  const d=new Date();
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function safe(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function renderRatio(text){return safe(text);}
function printReport(){
  calculate();
  window.print();
}
function calculate(){
  const unit=document.getElementById('unitInput').value.trim()||'—';
  const sizeRaw=document.getElementById('sizeInput').value;
  const size=sizeRaw||'—';
  const housePrice=parseFloat(document.getElementById('housePriceInput').value)||0;
  const parkingNo=document.getElementById('parkingNumberInput').value.trim();
  const parkingText=parkingNo?`${parkingFloor}-${parkingNo}`:parkingFloor;
  const parkingPriceRaw=document.getElementById('parkPriceInput').value;
  const parkingPrice=parseFloat(parkingPriceRaw)||0;
  const total=Math.round(housePrice+parkingPrice);
  const deposit=2;
  const sign=8;
  const startWork=Math.ceil(total*.05)-deposit-sign;
  const foundation=Math.round(total*.02);
  const firstFloor=Math.round(total*.02);
  const rf1=Math.round(total*.02);
  const rf2=Math.round(total*.02);
  const loan=Math.floor(total*.80);
  const handover=Math.ceil(total*.05);
  const rf3=total-(deposit+sign+startWork+foundation+firstFloor+rf1+rf2+loan+handover);
  const rows=[
    {name:'訂金',ratio:'',amount:deposit},
    {name:'簽約金',ratio:'',amount:sign},
    {name:'開工款',ratio:'5% - 10萬',amount:startWork},
    {name:'第一期工程款－基礎開挖完成',ratio:'2%',amount:foundation},
    {name:'第二期工程款－一樓底版完成',ratio:'2%',amount:firstFloor},
    {name:'第三期工程款－第一區RF完成',ratio:'2%',amount:rf1},
    {name:'第四期工程款－第二區RF完成',ratio:'2%',amount:rf2},
    {name:'第五期工程款－第三區RF完成',ratio:'2%',amount:rf3},
    {name:'銀行貸款',ratio:'80%',amount:loan},
    {name:'交屋保留款',ratio:'5%',amount:handover}
  ];
  document.getElementById('screenRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="ratio">${renderRatio(r.ratio)}</td><td class="amount">${money(r.amount)} 萬</td></tr>`).join('');
  document.getElementById('printRows').innerHTML=rows.map(r=>`<tr><td>${safe(r.name)}</td><td class="p-ratio">${renderRatio(r.ratio)}</td><td class="p-amount">${money(r.amount)} 萬</td></tr>`).join('');
  document.getElementById('screenTotalValue').textContent=money(total);
  document.getElementById('screenTotalAmount').textContent=money(total)+' 萬';
  document.getElementById('printTotalAmount').textContent=money(total)+' 萬';
  document.getElementById('printUnit').textContent=unit;
  document.getElementById('printSize').textContent=size;
  document.getElementById('printParking').textContent=parkingText;
  document.getElementById('printParkingPrice').textContent=parkingPriceRaw===''?'—':money(Math.round(parkingPrice));
  const t=nowText();
  document.getElementById('screenTime').textContent=t;
  document.getElementById('printTime').textContent=t;
}
document.getElementById('printBtn').addEventListener('click', printReport);
calculate();
</script>
</body>
</html>
