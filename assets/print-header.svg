<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="430" viewBox="0 0 2400 430" role="img" aria-label="弘峻莊園付款試算單表頭">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe700"/>
      <stop offset="0.48" stop-color="#d9e500"/>
      <stop offset="1" stop-color="#cfdc00"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6ff83" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#f6ff83" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#98ff4a" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#149432" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#003c18" stop-opacity="0.88"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6b5a18" flood-opacity="0.22"/>
    </filter>
    <g id="petal">
      <ellipse cx="0" cy="0" rx="82" ry="190" fill="url(#green)" opacity="0.82" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="82" ry="190" fill="url(#green)" opacity="0.72" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="82" ry="190" fill="url(#green)" opacity="0.72" transform="rotate(120)"/>
      <ellipse cx="0" cy="0" rx="54" ry="135" fill="#b7ff43" opacity="0.28" transform="rotate(30)"/>
      <circle cx="0" cy="0" r="44" fill="#d8ff52" opacity="0.22"/>
    </g>
  </defs>

  <rect width="2400" height="430" fill="url(#bg)"/>
  <circle cx="180" cy="355" r="190" fill="url(#light)"/>
  <circle cx="355" cy="416" r="190" fill="url(#light)"/>
  <circle cx="2068" cy="335" r="205" fill="url(#light)"/>
  <circle cx="2235" cy="410" r="170" fill="url(#light)"/>

  <g transform="translate(55,356) scale(0.95)">
    <use href="#petal" transform="translate(0,0) rotate(22)"/>
    <use href="#petal" transform="translate(218,105) scale(.82) rotate(-12)" opacity="0.88"/>
  </g>
  <g transform="translate(2328,346) scale(1.05)">
    <use href="#petal" transform="translate(0,0) rotate(-18)"/>
    <use href="#petal" transform="translate(-248,112) scale(.92) rotate(10)" opacity="0.9"/>
  </g>

  <g fill="none" stroke="#a77724" stroke-width="8" stroke-linecap="round" opacity="0.9" transform="translate(815,90) scale(.62)">
    <path d="M80 0 C125 20 125 78 80 104 C35 78 35 20 80 0Z"/>
    <path d="M80 0 C40 28 8 70 34 118 C86 120 112 82 80 0Z" transform="rotate(72 80 104)"/>
    <path d="M80 0 C40 28 8 70 34 118 C86 120 112 82 80 0Z" transform="rotate(144 80 104)"/>
    <path d="M80 0 C40 28 8 70 34 118 C86 120 112 82 80 0Z" transform="rotate(216 80 104)"/>
    <path d="M80 0 C40 28 8 70 34 118 C86 120 112 82 80 0Z" transform="rotate(288 80 104)"/>
  </g>

  <g filter="url(#softShadow)">
    <text x="450" y="235" fill="#17110a" font-family="Noto Serif TC, Source Han Serif TC, Songti TC, serif" font-size="118" font-weight="900" letter-spacing="8">弘峻莊園</text>
    <text x="590" y="318" fill="#17110a" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="500" letter-spacing="22">JADE GARDEN</text>
  </g>

  <line x1="1305" y1="118" x2="1305" y2="316" stroke="#8e6824" stroke-width="4" opacity="0.95"/>
  <path d="M1305 225 L1290 212 L1305 199 L1320 212 Z" fill="#8e6824" opacity="0.95"/>

  <g filter="url(#softShadow)">
    <text x="1415" y="235" fill="#2a1c0b" font-family="Noto Serif TC, Source Han Serif TC, Songti TC, serif" font-size="84" font-weight="900" letter-spacing="10">付款試算單</text>
    <text x="1424" y="306" fill="#9a6d24" font-family="Georgia, 'Times New Roman', serif" font-size="42" letter-spacing="16">Payment Estimate</text>
  </g>

  <rect x="0" y="423" width="2400" height="7" fill="#b8842a" opacity="0.95"/>
