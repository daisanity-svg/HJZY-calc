name: Patch print header
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-print-header.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Replace the generated CSS print header image cache key. This avoids iOS/Safari keeping the old blue blurred SVG render.
          s=s.replace('assets/print-header.svg?v=20260616-safe4', 'assets/print-header.svg?v=20260616-safe10')
          s=s.replace('assets/print-header.svg?v=20260616-safe9', 'assets/print-header.svg?v=20260616-safe10')
          s=s.replace('assets/print-header.svg?v=20260616-safe8', 'assets/print-header.svg?v=20260616-safe10')
          s=s.replace('assets/print-header.svg?v=20260616-safe7', 'assets/print-header.svg?v=20260616-safe10')
          s=s.replace('assets/print-header.svg?v=20260616-safe6', 'assets/print-header.svg?v=20260616-safe10')
          s=s.replace('assets/print-header.svg?v=20260616-safe5', 'assets/print-header.svg?v=20260616-safe10')
          s=s.replace('assets/print-header.svg?v=20260616', 'assets/print-header.svg?v=20260616-safe10')
          # Ensure the old in-DOM title row remains hidden because the uploaded header already contains the title.
          s=s.replace('.print-doc-head{display:flex;', '.print-doc-head{display:none!important;')
          # Ensure print pseudo-elements do not overlay the uploaded/header SVG.
          s=s.replace('.print-brand-hero:before,.print-brand-hero:after{content:"";', '.print-brand-hero:before,.print-brand-hero:after{content:none;')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then echo no changes; else git commit -m "Refresh print header cache key" && git push; fi
